<style id="linkXLCompositionsStyle">.lx-composition-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(230px,1fr);gap:16px}.lx-slot-list{max-height:320px;overflow:auto;display:grid;gap:6px}.lx-slot-list button{text-align:left;display:flex;gap:9px;align-items:center}.lx-slot-list b{display:grid;place-items:center;flex:0 0 25px;height:25px;background:#fff1ce;border-radius:50%}.lx-slot-list span{font-size:11px}.lx-template-preview [data-slot]{cursor:pointer;outline:none}.lx-template-preview [data-slot]:hover rect,.lx-template-preview [data-slot]:focus rect{stroke:#115779;stroke-width:6}.lx-picker-thumb{height:110px;display:flex;align-items:center;justify-content:center;background:#f6f7f8;border-radius:8px;margin:10px 0}.lx-picker-thumb img{max-height:100px;max-width:90%;object-fit:contain}.lx-picker-thumb .mdd-thumb{width:auto}.lx-module-picker{width:min(640px,calc(100vw - 24px))}@media(max-width:700px){.lx-composition-layout{grid-template-columns:1fr}.lx-slot-list{max-height:210px}}</style>
<script id="linkXLCompositions">
(()=>{'use strict';const $=id=>document.getElementById(id),copy=x=>JSON.parse(JSON.stringify(x));let pattern='line',assignments=[],draft=null,lastSlots=[],slotIndex=0,choice={};
const dialog=document.createElement('dialog');dialog.id='lxCompositionsDialog';dialog.className='lx-sales-dialog';dialog.innerHTML=`<header><div><h2>Ready compositions</h2><p>Choose your profile, then choose the light for each numbered position.</p></div><button type="button" class="lx-sales-close" id="lxCompositionsClose" aria-label="Close compositions">×</button></header><div class="lx-sales-grid"><label>Installation type<select id="lxTemplateType"><option value="surface">SF · Surface</option><option value="pendant">PD · Pendant</option><option value="recessed">Recessed</option><option value="trimless">Trimless</option></select></label><label>Profile system<select id="lxTemplateSystem"></select></label></div><div class="lx-template-options" id="lxTemplateOptions"></div><div class="lx-sales-grid"><label>Profile length A (mm)<input id="lxTemplateA" type="number" min="300" max="3000" step="1" value="1800"></label><label>Profile length B (mm)<input id="lxTemplateB" type="number" min="300" max="3000" step="1" value="1200"></label><label>Parallel spacing (mm)<input id="lxTemplateSpacing" type="number" min="150" max="5000" step="1" value="700"></label><label>Positions per profile<input id="lxTemplateModules" type="number" min="1" max="12" step="1" value="3"></label></div><div class="lx-composition-layout"><div class="lx-template-preview" id="lxTemplatePreview"></div><div><b>Choose your modules</b><p>Click a numbered position or choose from this list. You can also choose Blank.</p><div id="lxTemplateSlots" class="lx-slot-list"></div></div></div><p id="lxTemplateInfo" class="lx-sales-status" role="status"></p><label><input id="lxTemplateConfirm" type="checkbox"> Replace my current design. One Undo restores it.</label><div class="lx-sales-actions"><button type="button" id="lxTemplateApply" disabled>Apply composition</button></div>`;document.body.appendChild(dialog);
const picker=document.createElement('dialog');picker.id='lxSlotPicker';picker.className='lx-sales-dialog lx-module-picker';picker.innerHTML=`<header><div><h2 id="lxSlotTitle">Choose module</h2><p>Choose the exact model and specification for this position.</p></div><button type="button" class="lx-sales-close" id="lxSlotClose" aria-label="Close module picker">×</button></header><label>LED model<select id="lxSlotModel"><option value="">Choose a model…</option></select></label><div class="lx-picker-thumb" id="lxSlotThumb" hidden></div><div class="lx-sales-grid" id="lxSlotFields"></div><p id="lxSlotCode"></p><label><input type="checkbox" id="lxSlotAll"> Use this choice in all positions</label><div class="lx-sales-actions"><button type="button" id="lxSlotSave" disabled>Use this module</button><button type="button" id="lxSlotBlank">Use blank</button></div><p id="lxSlotStatus" class="lx-sales-status" role="status"></p>`;document.body.appendChild(picker);
for(const group of MODEL_GROUPS){const g=document.createElement('optgroup');g.label=group.label;for(const key of group.types){if(!LED_TYPES[key])continue;const o=document.createElement('option');o.value=key;o.textContent=LED_TYPES[key].name;g.appendChild(o);}$('lxSlotModel').appendChild(g);}
const button=document.createElement('button');button.id='btnCompositions';button.type='button';button.className='tool lx-entry';button.textContent='Ready compositions';$('btnCreateRoom').before(button);
function spec(){return {pattern,type:$('lxTemplateType').value,system:$('lxTemplateSystem').value,a:Number($('lxTemplateA').value),b:Number($('lxTemplateB').value),spacing:Number($('lxTemplateSpacing').value),modules:Number($('lxTemplateModules').value),assignments};}
function systems(){const systems=LINKXLTemplates.systems($('lxTemplateType').value),previous=$('lxTemplateSystem').value;$('lxTemplateSystem').replaceChildren();for(const [key,label]of Object.entries(systems)){const o=document.createElement('option');o.value=key;o.textContent=label;$('lxTemplateSystem').appendChild(o);}$('lxTemplateSystem').value=Object.hasOwn(systems,previous)?previous:Object.hasOwn(systems,state.system)?state.system:Object.keys(systems)[0];}
function cards(){const host=$('lxTemplateSlots');host.replaceChildren();for(const slot of lastSlots){const m=assignments[slot.index],b=document.createElement('button');b.type='button';const n=document.createElement('b'),t=document.createElement('span');n.textContent=slot.index+1;t.textContent=slot.label+' · '+(!m?'Choose module':m.blank?'Blank':LED_TYPES[m.type].short+' · '+ledLen(m)+' mm · '+m.cct+' · '+(m.beam||m.amtype||''));b.append(n,t);b.onclick=()=>openPicker(slot.index);host.appendChild(b);}}
function preview(){try{draft=LINKXLTemplates.generate(spec());lastSlots=draft.slots;$('lxTemplatePreview').innerHTML=draft.svg;$('lxTemplateInfo').textContent=`${LINK_TYPE_LABEL[draft.type]} · ${Math.round(draft.width)} × ${Math.round(draft.height)} mm · ${draft.slots.length-draft.unassigned}/${draft.slots.length} positions chosen`;$('lxTemplateInfo').dataset.error='false';}catch(e){draft=null;$('lxTemplatePreview').replaceChildren();$('lxTemplateInfo').textContent=e.message;$('lxTemplateInfo').dataset.error='true';}cards();$('lxTemplateApply').disabled=!draft||draft.unassigned>0||!$('lxTemplateConfirm').checked;}
function open(){if(window.LINKXLAdvanced?.busy)return;$('lxTemplateType').value=TYPE;systems();$('lxTemplateConfirm').checked=false;preview();dialog.showModal();}
button.onclick=open;$('lxCompositionsClose').onclick=()=>dialog.close();$('lxTemplateType').onchange=()=>{systems();$('lxTemplateConfirm').checked=false;preview();};$('lxTemplateSystem').onchange=()=>{$('lxTemplateConfirm').checked=false;preview();};
const icons={line:'M5 17h60',parallel:'M5 9h60M5 25h60',three:'M5 5h60M5 17h60M5 29h60',l:'M8 5v22h55',u:'M7 5v22h56V5',frame:'M7 5h56v22H7z'};for(const p of LINKXLTemplates.patterns){const b=document.createElement('button');b.type='button';b.dataset.pattern=p.id;b.setAttribute('aria-pressed',String(p.id===pattern));b.innerHTML='<svg viewBox="0 0 70 34" aria-hidden="true"><path d="'+icons[p.id]+'"/></svg><span></span>';b.lastElementChild.textContent=p.name;b.onclick=()=>{pattern=p.id;assignments=[];$('lxTemplateConfirm').checked=false;for(const x of $('lxTemplateOptions').children)x.setAttribute('aria-pressed',String(x===b));$('lxTemplateB').disabled=['line','parallel','three'].includes(pattern);$('lxTemplateSpacing').disabled=!['parallel','three'].includes(pattern);preview();};$('lxTemplateOptions').appendChild(b);}
$('lxTemplateB').disabled=true;$('lxTemplateSpacing').disabled=true;
for(const id of ['lxTemplateA','lxTemplateB','lxTemplateSpacing','lxTemplateModules'])$(id).oninput=()=>{if(id==='lxTemplateModules')assignments=[];$('lxTemplateConfirm').checked=false;preview();};$('lxTemplateConfirm').onchange=preview;
$('lxTemplatePreview').onclick=e=>{const n=e.target.closest('[data-slot]');if(n)openPicker(Number(n.dataset.slot));};$('lxTemplatePreview').onkeydown=e=>{if(['Enter',' '].includes(e.key)&&e.target.closest('[data-slot]')){e.preventDefault();openPicker(Number(e.target.closest('[data-slot]').dataset.slot));}};
function openPicker(index){slotIndex=index;choice=copy(assignments[index]&&!assignments[index].blank?assignments[index]:{});$('lxSlotTitle').textContent='Position '+(index+1)+' · '+(lastSlots[index]?.label||'');$('lxSlotModel').value=choice.type||'';$('lxSlotAll').checked=false;$('lxSlotStatus').textContent='';fields();picker.showModal();}
function fields(){const key=$('lxSlotModel').value,t=LED_TYPES[key],host=$('lxSlotFields');host.replaceChildren();$('lxSlotSave').disabled=!t;$('lxSlotThumb').hidden=!t;$('lxSlotCode').textContent='';if(!t){choice={};return;}choice.type=key;if(!t.ccts.includes(choice.cct))choice.cct=t.ccts[0];$('lxSlotThumb').innerHTML=moduleThumbHTML(key);
 function select(k,label,options){const row=document.createElement('label');row.textContent=label;const s=document.createElement('select');s.id='lxSlot_'+k;for(const option of options){const o=document.createElement('option');o.value=option.value;o.textContent=option.label;s.appendChild(o);}if(options.some(x=>String(x.value)===String(choice[k])))s.value=choice[k];else choice[k]=k==='wl'?Number(s.value):s.value;row.appendChild(s);host.appendChild(row);s.onchange=()=>{choice[k]=k==='wl'?Number(s.value):s.value;if(k==='cct'||k==='wl')fields();else code();};}
 for(const slot of t.slots){if(slot==='cri')continue;if(COMPOSITES[slot]){for(const p of COMPOSITES[slot].parts)select(p.key,p.label,p.options.map(x=>({value:x,label:x})));}else if(slot==='wl')select('wl','Length / output',wlArrayFor(t,choice.cct).map((x,i)=>({value:i,label:x.len+' mm'+(x.w?' · '+String(x.w).replace(/W$/i,'')+' W':'')})));else select(slot,SLOT_LABEL[slot]||slot,slotOptions(t,slot).map(x=>({value:x,label:x})));}select('dimming','Dimming',dimOptionsFor(t,choice.cct,ledLen(choice)).map(x=>({value:x,label:x})));code();}
function code(){try{$('lxSlotCode').textContent=ledCode(LINKXLTemplates.validModule(choice));$('lxSlotSave').disabled=false;}catch(e){$('lxSlotCode').textContent=e.message;$('lxSlotSave').disabled=true;}}
$('lxSlotModel').onchange=()=>{choice={};fields();};$('lxSlotClose').onclick=()=>picker.close();
function assign(value){const chosen=value.blank?{blank:true}:LINKXLTemplates.validModule(value);if($('lxSlotAll').checked)assignments=lastSlots.map(()=>copy(chosen));else assignments[slotIndex]=copy(chosen);$('lxTemplateConfirm').checked=false;picker.close();preview();}
$('lxSlotSave').onclick=()=>{try{assign(choice);}catch(e){$('lxSlotStatus').textContent=e.message;}};$('lxSlotBlank').onclick=()=>assign({blank:true});
$('lxTemplateApply').onclick=()=>{if(!draft||draft.unassigned||!$('lxTemplateConfirm').checked)return;try{LINKXLTemplates.apply(spec());dialog.close();}catch(e){$('lxTemplateInfo').textContent=e.message;}};
window.addEventListener('keydown',e=>{if(!dialog.open&&!picker.open)return;if(!picker.open&&e.target.closest?.('[data-slot]')&&['Enter',' '].includes(e.key)){e.preventDefault();openPicker(Number(e.target.closest('[data-slot]').dataset.slot));}if((e.ctrlKey||e.metaKey)&&['s','z','y','d','g'].includes(e.key.toLowerCase())||['Delete','Backspace'].includes(e.key)&&!e.target.closest('input,textarea'))e.preventDefault();e.stopImmediatePropagation();},true);
window.LINKXLCompositions={open,get hasModal(){return dialog.open||picker.open;},getInfo:()=>({pattern,assignments:copy(assignments),slots:lastSlots.length,unassigned:draft?.unassigned??null,valid:!!draft,type:$('lxTemplateType').value,system:$('lxTemplateSystem').value})};
})();
</script>
