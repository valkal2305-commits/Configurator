<style id="linkXLFloorPlanStyle">
.lx-floor-panel{position:absolute;left:10px;top:50px;z-index:34;width:min(270px,calc(100% - 20px));max-height:calc(100% - 65px);overflow:auto;box-sizing:border-box;border:1px solid var(--line);border-radius:10px;background:#fffffffa;box-shadow:0 5px 20px #182c3b22;padding:12px;font:11px/1.5 var(--sans);color:var(--ink)}.lx-floor-panel[hidden]{display:none}.lx-floor-panel header{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700}.lx-floor-panel button{font:11px var(--sans);padding:7px;border:1px solid var(--line);border-radius:5px;background:white;cursor:pointer;color:var(--ink)}.lx-floor-panel button[aria-pressed=true]{background:#fff3d5;border-color:#d8b152}.lx-floor-panel button:disabled{opacity:.4;cursor:default}.lx-floor-panel label{display:block;margin:8px 0;color:var(--ink-dim)}.lx-floor-panel input[type=number]{width:100%;box-sizing:border-box;padding:6px;border:1px solid var(--line);border-radius:4px;font:12px var(--sans)}.lx-floor-panel .lx-plan-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.lx-floor-panel .lx-plan-actions{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.lx-floor-panel p{font-size:10px;color:var(--ink-dim);line-height:1.6;margin:8px 0}.lx-plan-hint{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);z-index:35;padding:9px 13px;border:1px solid #d8b152;border-radius:8px;background:#fff7e4;font:11px var(--sans);max-width:calc(100% - 30px);box-sizing:border-box;pointer-events:none;text-align:center}.lx-plan-hint[hidden]{display:none}#scene.lx-plan-working,#scene.lx-plan-working *{cursor:crosshair!important}#scene.lx-plan-moving,#scene.lx-plan-moving *{cursor:grab!important}.lx-plan-scale{margin:auto;width:min(350px,calc(100vw - 24px));padding:22px;border:1px solid #d8dfe4;border-radius:12px;font:13px var(--sans);color:#263440}.lx-plan-scale::backdrop{background:#17232a88}.lx-plan-scale input{padding:9px;width:100%;box-sizing:border-box;margin:10px 0;border:1px solid #ccd5da; <script id="linkXLFloorPlan">
(()=>{
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg',wrap=scene.parentElement;
let config=null,picture=null,mode=null,first=null,pointer=null,historyPlan=[],panelOpen=false,version=0;
const panel=document.createElement('aside');panel.className='lx-floor-panel';panel.id='lxFloorPanel';panel.hidden=true;panel.setAttribute('aria-label','Floor plan reference');panel.innerHTML=`<header><span>Floor plan reference</span><button type="button" id="lxPlanClose" aria-label="Close floor plan tools">×</button></header><p>PNG / JPG / WebP reference for the 2D design. Set a known distance before using its scale. Room walls and lux surfaces are configured separately.</p><input type="file" id="lxPlanFile" accept="image/png,image/jpeg,image/webp" hidden><div class="lx-plan-actions"><button type="button" id="lxPlanLoad">Import image</button><button type="button" id="lxPlanRemove" disabled>Remove</button><button type="button" id="lxPlanUndo" disabled>Undo plan</button></div><p id="lxPlanStatus" role="status">No floor plan loaded.</p><label><input id="lxPlanVisible" type="checkbox" checked> Show floor plan</label><div class="lx-plan-actions"><button type="button" id="lxPlanCalibrate" disabled>Set scale · 2 points</button><button type="button" id="lxPlanMove" disabled>Move plan</button><button type="button" id="lxPlanFit" disabled>Fit plan</button></div><div class="lx-plan-grid"><label>Origin X (m)<input id="lxPlanX" type="number" step="0.01" min="-1000" max="1000" disabled></label><label>Origin Y (m)<input id="lxPlanY" type="number" step="0.01" min="-1000" max="1000" disabled></label><label>Rotation (°)<input id="lxPlanAngle" type="number" step="1" min="-180" max="180" disabled></label><label>Opacity (%)<input id="lxPlanOpacity" type="number" step="1" min="5" max="100" disabled></label></div><p>Move / scaling changes the background only. Space or middle/right drag still pans the view. Esc cancels the active operation.</p>`;wrap.appendChild(panel);

const scaleDialog=document.createElement('dialog');scaleDialog.id='lxPlanScaleDialog';scaleDialog.className='lx-plan-scale';scaleDialog.innerHTML='<form method="dialog" id="lxPlanScaleForm"><b>Known distance between the two points</b><label><input id="lxPlanDistance" type="number" min="0.01" max="1000" step="any" required aria-label="Known distance in metres"> metres</label><p id="lxPlanScaleInfo"></p><div style="display:flex;gap:8px;justify-content:flex-end"><button type="button" id="lxPlanScaleCancel">Cancel</button><button type="submit">Apply scale</button></div></form>';document.body.appendChild(scaleDialog);let scalePair=null;
function status(text,error=false){$('lxPlanStatus').textContent=text;$('lxPlanStatus').style.color=error?'#9a322d':'';}
const copyConfig=c=>c?{...c,calibration:c.calibration?JSON.parse(JSON.stringify(c.calibration)):null}:null;
function remember(){historyPlan.push(copyConfig(config));if(historyPlan.length>30)historyPlan.shift();}
function setMode(next){if(drag)return;mode=next;first=null;pointer=null;if(mode){leaveMeasureMode();LINKXLNavigation?.setTool('select');}scene.classList.toggle('lx-plan-working',mode==='scale');scene.classList.toggle('lx-plan-moving',mode==='move');hint.hidden=!mode;hint.textContent=mode==='scale'?'Set scale: click the first point of a known distance.':'Move plan: drag the image · Esc cancels / exits';sync();render();}
function open(value=true){panelOpen=!!value;panel.hidden=!panelOpen;if(!panelOpen)setMode(null);placeSelBar();}
function sync(){const yes=!!config;for(const id of ['lxPlanRemove','lxPlanCalibrate','lxPlanMove','lxPlanFit','lxPlanX','lxPlanY','lxPlanAngle','lxPlanOpacity','lxPlanVisible'])$(id).disabled=!yes;$('lxPlanUndo').disabled=!historyPlan.length;$('lxPlanCalibrate').setAttribute('aria-pressed',String(mode==='scale'));$('lxPlanMove').setAttribute('aria-pressed',String(mode==='move'));if(!yes){status('No floor plan loaded.');return;}$('lxPlanVisible').checked=config.visible;$('lxPlanX').value=config.x/1000;$('lxPlanY').value=config.y/1000;$('lxPlanAngle').value=config.angle;$('lxPlanOpacity').value=Math.round(config.opacity*100);status(config.name+' · '+(config.calibration?`Scale set · 1 pixel = ${config.mmPerPixel.toFixed(3)} mm`:'Scale not set · reference only'));}
function imageSize(data){let bytes;try{bytes=atob(data.slice(data.indexOf(',')+1));}catch(_){throw new Error('Invalid floor plan image encoding.');}const n=i=>bytes.charCodeAt(i),u32=i=>((n(i)*16777216)+(n(i+1)<<16)+(n(i+2)<<8)+n(i+3));if(data.startsWith('data:image/png;')){if(bytes.slice(0,8)!=='\x89PNG\r\n\x1a\n'||bytes.slice(12,16)!=='IHDR'||bytes.slice(-8,-4)!=='IEND')throw new Error('Invalid PNG image.');return [u32(16),u32(20)];}if(n(0)!==255||n(1)!==216||n(bytes.length-2)!==255||n(bytes.length-1)!==217)throw new Error('Invalid JPEG image.');for(let i=2;i<bytes.length;){if(n(i++)!==255)throw new Error('Invalid JPEG marker.');while(n(i)===255)i++;const marker=n(i++);if(marker===217||marker===218)break;if(marker===1||marker>=208&&marker<=215)continue;const len=(n(i)<<8)+n(i+1);if(len<2||i+len>bytes.length)break;if([192,193,194,195,197,198,199,201,202,203,205,206,207].includes(marker))return [(n(i+5)<<8)+n(i+6),(n(i+3)<<8)+n(i+4)];i+=len;}throw new Error('JPEG image dimensions are unavailable.');}
function validate(value){if(value==null)return null;if(typeof value!=='object'||Array.isArray(value))throw new Error('Invalid floor plan.');const d=JSON.parse(JSON.stringify(value));if(typeof d.data!=='string'||!/^data:image\/(png|jpeg);base64,[a-z0-9+/=]+$/i.test(d.data)||d.data.length>11000000)throw new Error('Invalid or oversized floor plan image.');const dimensions=imageSize(d.data);if(dimensions[0]!==d.width||dimensions[1]!==d.height)throw new Error('Floor plan dimensions do not match the image.');if(typeof d.name!=='string'||d.name.length>200)throw new Error('Invalid floor plan name.');for(const [key,min,max]of [['width',1,4096],['height',1,4096],['x',-1000000,1000000],['y',-1000000,1000000],['angle',-180,180],['opacity',.05,1],['mmPerPixel',.0001,10000]])if(!Number.isFinite(d[key])||d[key]<min||d[key]>max)throw new Error('Invalid floor plan '+key+'.');if(typeof d.visible!=='boolean')throw new Error('Invalid plan visibility.');if(d.calibration){const q=d.calibration;if(!q.a||!q.b||!Number.isFinite(q.distanceMm)||q.distanceMm<10||q.distanceMm>1000000)throw new Error('Invalid calibration.');for(const p of [q.a,q.b])if(!Number.isFinite(p.x)||!Number.isFinite(p.y)||p.x<0||p.y<0||p.x>d.width||p.y>d.height)throw new Error('Calibration points are outside the image.');const n=Math.hypot(q.b.x-q.a.x,q.b.y-q.a.y);if(n<1||Math.abs(q.distanceMm/n-d.mmPerPixel)>1e-6*Math.max(1,d.mmPerPixel))throw new Error('Inconsistent floor plan scale.');}else d.calibration=null;return d;}
function apply(value,{keepHistory=false}={}){const d=validate(value);finish(true);version++;config=d;if(!keepHistory)historyPlan=[];setMode(null);sync();render();}
async function load(file){if(!file)return;if(!['image/png','image/jpeg','image/webp'].includes(file.type)||file.size>10000000)throw new Error('Choose a PNG, JPG or WebP image up to 10 MB.');const url=URL.createObjectURL(file);let img;try{img=await new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=()=>reject(new Error('Image could not be opened.'));im.src=url;});}finally{URL.revokeObjectURL(url);}const f=Math.min(1,4096/Math.max(img.naturalWidth,img.naturalHeight)),cv=document.createElement('canvas');cv.width=Math.round(img.naturalWidth*f);cv.height=Math.round(img.naturalHeight*f);cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);let data=cv.toDataURL('image/png');if(data.length>10000000)data=cv.toDataURL('image/jpeg',.9);if(data.length>11000000)throw new Error('The image is too large after resizing. Use a smaller plan.');const b=designBounds([...state.profiles,...state.corners].map(x=>x.id)),mpp=5000/cv.width;const next={data,name:file.name.slice(0,200),width:cv.width,height:cv.height,mmPerPixel:mpp,x:(b?(b.x0+b.x1)/2:sxToMm(W/2))-cv.width*mpp/2,y:(b?(b.y0+b.y1)/2:syToMm(H/2))-cv.height*mpp/2,angle:0,opacity:.4,visible:true,calibration:null};remember();await apply(next,{keepHistory:true});open();fit();}
function pointToWorld(p,c=config){const a=c.angle*Math.PI/180,s=Math.sin(a),q=Math.cos(a);return {x:c.x+c.mmPerPixel*(p.x*q-p.y*s),y:c.y+c.mmPerPixel*(p.x*s+p.y*q)};}
function worldToPoint(p,c=config){const a=c.angle*Math.PI/180,s=Math.sin(a),q=Math.cos(a),x=(p.x-c.x)/c.mmPerPixel,y=(p.y-c.y)/c.mmPerPixel;return {x:x*q+y*s,y:-x*s+y*q};}
function eventWorld(e){const r=scene.getBoundingClientRect();return {x:sxToMm(e.clientX-r.left),y:syToMm(e.clientY-r.top)};}
function fit(){if(!config)return;const pts=[[0,0],[config.width,0],[config.width,config.height],[0,config.height]].map(([x,y])=>pointToWorld({x,y})),x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x)),y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));state.scale=Math.max(.02,Math.min(4,Math.min((W-70)/(x1-x0),(H-70)/(y1-y0))));state.panX=W/2-(x0+x1)/2*state.scale;state.panY=H/2-(y0+y1)/2*state.scale;render();}
function draw(){if(!config||!config.visible)return;const g=document.createElementNS(NS,'g');g.id='lxFloorImage';g.setAttribute('pointer-events','none');g.setAttribute('transform',`translate(${mmToSx(config.x)} ${mmToSy(config.y)}) rotate(${config.angle}) scale(${state.scale*config.mmPerPixel})`);const im=document.createElementNS(NS,'image');im.setAttribute('href',config.data);im.setAttribute('width',config.width);im.setAttribute('height',config.height);im.setAttribute('opacity',config.opacity);g.appendChild(im);const firstItem=scene.querySelector(':scope > g[data-id]');if(firstItem)scene.insertBefore(g,firstItem);else scene.appendChild(g);if(first){const p=pointToWorld(first);const marker=el('g',{'pointer-events':'none','data-plan-marker':'1'});marker.appendChild(el('circle',{cx:mmToSx(p.x),cy:mmToSy(p.y),r:5,fill:'#c18c17',stroke:'white','stroke-width':2}));scene.appendChild(marker);}}
const oldRender=render;render=function(){oldRender();draw();};
window.addEventListener('pointerdown',e=>{if(!mode||!config||e.button!==0||!scene.contains(e.target)||LINKXLNavigation?.isPanning)return;e.preventDefault();e.stopImmediatePropagation();const world=eventWorld(e),p=worldToPoint(world);if(p.x<0||p.y<0||p.x>config.width||p.y>config.height){status('Choose a point inside the floor plan image.',true);return;}if(mode==='scale'){if(!first){first=p;hint.textContent='Set scale: click the second point of the known distance.';render();}else{if(Math.hypot(p.x-first.x,p.y-first.y)<10){status('Choose points at least 10 image pixels apart.',true);return;}scalePair={a:{...first},b:p,anchor:pointToWorld(first)};$('lxPlanDistance').value='';$('lxPlanScaleInfo').textContent='Use a real dimension marked on the plan. The drawing itself is not resized.';scaleDialog.showModal();$('lxPlanDistance').focus();}}else{pointer={id:e.pointerId,start:world,before:copyConfig(config)};try{scene.setPointerCapture(e.pointerId);}catch(_){}}},true);
window.addEventListener('pointermove',e=>{if(!pointer||e.pointerId!==pointer.id)return;e.preventDefault();e.stopImmediatePropagation();const p=eventWorld(e);config.x=pointer.before.x+p.x-pointer.start.x;config.y=pointer.before.y+p.y-pointer.start.y;render();},true);
function finish(cancel=false){if(!pointer)return;const p=pointer;pointer=null;if(cancel)config=p.before;else if(config.x!==p.before.x||config.y!==p.before.y){historyPlan.push(p.before);version++;}try{scene.releasePointerCapture(p.id);}catch(_){}sync();render();}
window.addEventListener('pointerup',e=>{if(pointer){e.preventDefault();e.stopImmediatePropagation();finish();}},true);window.addEventListener('pointercancel',()=>finish(true),true);window.addEventListener('blur',()=>finish(true));
$('lxPlanScaleForm').onsubmit=e=>{e.preventDefault();if(!$('lxPlanDistance').reportValidity()||!scalePair)return;const mm=Number($('lxPlanDistance').value)*1000,dist=Math.hypot(scalePair.b.x-scalePair.a.x,scalePair.b.y-scalePair.a.y);if(mm/dist<.0001||mm/dist>10000){$('lxPlanScaleInfo').textContent='Choose a wider span in the image or check the entered distance.';return;}remember();const a=config.angle*Math.PI/180;config.mmPerPixel=mm/dist;config.x=scalePair.anchor.x-config.mmPerPixel*(scalePair.a.x*Math.cos(a)-scalePair.a.y*Math.sin(a));config.y=scalePair.anchor.y-config.mmPerPixel*(scalePair.a.x*Math.sin(a)+scalePair.a.y*Math.cos(a));config.calibration={a:scalePair.a,b:scalePair.b,distanceMm:mm};version++;scaleDialog.close();scalePair=null;setMode(null);status('Scale set. Move the plan to align it with your design if needed.');};
$('lxPlanScaleCancel').onclick=()=>{scalePair=null;scaleDialog.close();setMode(null);};scaleDialog.addEventListener('cancel',()=>{scalePair=null;setMode(null);});
$('lxPlanLoad').onclick=()=>$('lxPlanFile').click();$('lxPlanFile').onchange=async e=>{try{await load(e.target.files[0]);}catch(err){status(err.message,true);}e.target.value='';};$('lxPlanClose').onclick=()=>open(false);$('lxPlanRemove').onclick=()=>{remember();apply(null,{keepHistory:true});};$('lxPlanUndo').onclick=async()=>{if(historyPlan.length)await apply(historyPlan.pop(),{keepHistory:true});};$('lxPlanFit').onclick=fit;$('lxPlanCalibrate').onclick=()=>setMode(mode==='scale'?null:'scale');$('lxPlanMove').onclick=()=>setMode(mode==='move'?null:'move');
$('lxPlanVisible').onchange=()=>{if(config){remember();config.visible=$('lxPlanVisible').checked;version++;render();}};
for(const id of ['lxPlanX','lxPlanY','lxPlanAngle','lxPlanOpacity'])$(id).onchange=()=>{if(!config)return;if(![...panel.querySelectorAll('input[type=number]')].every(x=>x.checkValidity()))return;remember();config.x=Number($('lxPlanX').value)*1000;config.y=Number($('lxPlanY').value)*1000;config.angle=Number($('lxPlanAngle').value);config.opacity=Number($('lxPlanOpacity').value)/100;version++;render();};
window.addEventListener('keydown',e=>{if(!mode&&!scaleDialog.open)return;if(scaleDialog.open&&e.key!=='Escape'){if((e.ctrlKey||e.metaKey)&&['s','z','y','d','g'].includes(e.key.toLowerCase()))e.preventDefault();e.stopImmediatePropagation();return;}if(e.key==='Escape'){e.preventDefault();e.stopImmediatePropagation();if(scaleDialog.open)scaleDialog.close();finish(true);scalePair=null;setMode(null);}else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'&&!e.target.closest('input,textarea')){e.preventDefault();e.stopImmediatePropagation();$('lxPlanUndo').click();}},true);
const navButton=document.createElement('button');navButton.id='lxNavPlan';navButton.type='button';navButton.title='Floor plan reference';navButton.setAttribute('aria-label','Floor plan reference');navButton.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h18v18H3zM3 11h8V3m0 18V11h10"/></svg>';navButton.onclick=()=>open(!panelOpen);$('lxNavigation').appendChild(navButton);
window.LINKXLPlan={open,load,apply,validate,exportState:()=>copyConfig(config),get active(){return !!mode;},get version(){return version;},getInfo:()=>({loaded:!!config,calibrated:!!config?.calibration,mode,version}),pointToWorld,worldToPoint,fit};
sync();render();
})();
