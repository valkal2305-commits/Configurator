<style id="linkXLExportStyle">
.lx-open-export{display:flex;align-items:center;gap:7px;flex-wrap:wrap;color:var(--ink-dim,#566777);font:11px/1.5 var(--sans,Arial,sans-serif);cursor:pointer}.lx-open-export input{width:14px;height:14px;margin:0;accent-color:#d9a326;flex:none}.lx-export-setting{padding:12px;border-top:1px solid var(--line,#dde3e7)}.lx-export-setting small{display:block;color:#77838e;font-size:10px;margin-top:5px}.lx-last-export{padding:10px 12px;border-top:1px solid var(--line,#dde3e7);font:11px/1.5 var(--sans,Arial,sans-serif);color:#566777}.lx-last-export[hidden]{display:none}.lx-last-export b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:260px;color:var(--ink,#263440)}.lx-last-export button{background:white;border:1px solid #d8dfe4;border-radius:5px;padding:5px 7px;margin:7px 5px 0 0;color:#263440;font:11px var(--sans,Arial,sans-serif);cursor:pointer}.lx-export-preview{position:fixed;inset:0;margin:auto;width:min(1100px,calc(100vw - 24px));height:min(860px,calc(100dvh - 24px));max-height:calc(100dvh - 24px);padding:0;border:1px solid #d8dfe4;border-radius:12px;background:#f1f3f5;color:#263440;box-sizing:border-box;font:12px var(--sans,Arial,sans-serif)}.lx-export-preview::backdrop{background:#17232a99}.lx-export-preview[open]{display:flex;flex-direction:column}.lx-export-preview header{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;background:white;border-bottom:1px solid #d8dfe4}.lx-export-preview header b{flex:1;min-width:120px;overflow-wrap:anywhere}.lx-export-preview button,.lx-export-preview a{display:inline-block;background:white;border:1px solid #ccd5da;padding:7px 10px;border-radius:5px;color:#263440;text-decoration:none;cursor:pointer;font:12px var(--sans,Arial,sans-serif)}.lx-export-preview main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}.lx-export-preview iframe{border:0;width:100%;height:100%;background:white}.lx-export-preview img{display:block;max-width:100%;max-height:100%;object-fit:contain}.lx-export-preview p{margin:0;padding:7px 14px;background:white;color:#687782;font-size:11px}.lx-footer>.lx-open-export{margin:0 8px}.lx-workspace-dialog>.lx-open-export{margin:12px 0}
</style>
<script id="linkXLExport">
(()=>{
'use strict';
const $=id=>document.getElementById(id),key='link-xl-open-after-export-v1',boxes=[],openTabs=new Set();let enabled=true,last=null,previewURL=null,returnFocus=null;
try{const saved=localStorage.getItem(key);if(saved!==null)enabled=saved!=='false';}catch(_){}
function preference(id){const label=document.createElement('label');label.className='lx-open-export';const input=document.createElement('input');input.id=id;input.type='checkbox';input.checked=enabled;input.onchange=()=>setEnabled(input.checked);label.append(input,document.createTextNode('Open after export'));label.title='Automatically preview exported PDF and image files';boxes.push(input);return label;}
function setEnabled(value){enabled=!!value;for(const box of boxes)box.checked=enabled;try{localStorage.setItem(key,String(enabled));}catch(_){}}
const setting=document.createElement('div');setting.className='lx-export-setting';setting.appendChild(preference('lxOpenAfterExport'));const help=document.createElement('small');help.textContent='PDF / image preview. Other file types use your browser’s opening settings.';setting.appendChild(help);$('xpMenu').appendChild(setting);
const latest=document.createElement('section');latest.id='lxLastExport';latest.className='lx-last-export';latest.hidden=true;latest.innerHTML='<span>Latest exported file</span><b id="lxLastExportName"></b><span id="lxLastExportState"></span><div><button type="button" id="lxLastExportPreview">Preview</button><button type="button" id="lxLastExportDownload">Download a copy</button></div>';$('xpMenu').appendChild(latest);
$('lxRoom').querySelector('.lx-footer').insertBefore(preference('lxRoomOpenAfterExport'),$('lxRoom').querySelector('.lx-footer').lastElementChild);$('lxScenarioDialog').querySelector('.lx-scenario-actions').after(preference('lxScenarioOpenAfterExport'));
// Include the setting and last-file actions in the existing Export menu keyboard navigation.
$('xpMenu').addEventListener('keydown',e=>{if(!['ArrowDown','ArrowUp','Home','End'].includes(e.key))return;const items=[...$('xpMenu').querySelectorAll('button,input')].filter(el=>!el.disabled&&el.getClientRects().length),index=items.indexOf(document.activeElement);if(!items.length)return;e.preventDefault();e.stopImmediatePropagation();const target=e.key==='Home'?0:e.key==='End'?items.length-1:(index+(e.key==='ArrowDown'?1:-1)+items.length)%items.length;items[target].focus();},true);
function previewType(blob,name){const type=(blob.type||'').split(';')[0].toLowerCase();if(type==='application/pdf'||/\.pdf$/i.test(name))return 'pdf';if(['image/jpeg','image/png','image/webp'].includes(type))return 'image';return null;}
function rawDownload(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function record(blob,name,confirmed){const entry={blob,name:String(name||'LINK_XL_export'),confirmed:!!confirmed,kind:previewType(blob,name),mode:null};last=entry;latest.hidden=false;$('btnExport').disabled=false;$('lxLastExportName').textContent=entry.name;$('lxLastExportName').title=entry.name;$('lxLastExportState').textContent=confirmed?'Saved in the selected folder.':'Download requested. Keep the browser download to save the file.';$('lxLastExportPreview').hidden=!entry.kind;if(enabled&&entry.kind)setTimeout(()=>{if(enabled)openPreview(entry);},0);return true;}
function completed(blob,name,confirmed=false){try{return record(blob,name,confirmed);}catch(_){return true;}}
function download(blob,name){rawDownload(blob,name);return completed(blob,name,false);}
const dialog=document.createElement('dialog');dialog.id='lxExportPreview';dialog.className='lx-export-preview';dialog.setAttribute('aria-labelledby','lxExportPreviewName');dialog.innerHTML='<header><b id="lxExportPreviewName"></b><button type="button" id="lxExportPreviewTab">Open in new tab</button><button type="button" id="lxExportPreviewDownload">Download a copy</button><button type="button" id="lxExportPreviewClose" aria-label="Close preview">×</button></header><p id="lxExportPreviewStatus"></p><main id="lxExportPreviewContent"></main>';document.body.appendChild(dialog);let dialogEntry=null;
function previewContent(doc,entry,url){const node=doc.createElement(entry.kind==='pdf'?'iframe':'img');if(entry.kind==='pdf'){node.title='PDF preview · '+entry.name;node.src=url;}else{node.alt=entry.name;node.src=url;}return node;}
function releaseDialog(){if(previewURL)URL.revokeObjectURL(previewURL);previewURL=null;dialogEntry=null;$('lxExportPreviewContent').replaceChildren();if(returnFocus?.isConnected)returnFocus.focus({preventScroll:true});returnFocus=null;}
function inDialog(entry){if(dialog.open){dialog.close();releaseDialog();}returnFocus=document.activeElement;dialogEntry=entry;previewURL=URL.createObjectURL(entry.blob);$('lxExportPreviewName').textContent=entry.name;$('lxExportPreviewStatus').textContent=entry.confirmed?'Saved · preview of the exported file.':'Export ready · keep the browser download to save the file.';$('lxExportPreviewContent').replaceChildren(previewContent(document,entry,previewURL));entry.mode='dialog';dialog.showModal();$('lxExportPreviewClose').focus();}
function inTab(entry){let tab;try{tab=window.open('','_blank');}catch(_){}if(!tab||tab.closed)return false;let url;
 try{tab.opener=null;url=URL.createObjectURL(entry.blob);const doc=tab.document;doc.documentElement.lang='en';const meta=doc.createElement('meta');meta.name='viewport';meta.content='width=device-width,initial-scale=1';const title=doc.createElement('title');title.textContent=entry.name;const style=doc.createElement('style');style.textContent='*{box-sizing:border-box}html,body{height:100%;margin:0;font:13px Arial,sans-serif;background:#edf0f2;color:#263440}body{display:flex;flex-direction:column}header{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:white;border-bottom:1px solid #d8dfe4}strong{flex:1;overflow-wrap:anywhere}a{color:#263440;border:1px solid #ccd5da;border-radius:5px;padding:7px 10px;text-decoration:none}small{display:block;padding:6px 16px;background:white;color:#687782}main{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}iframe{width:100%;height:100%;border:0}img{max-width:100%;max-height:100%;object-fit:contain}';doc.head.replaceChildren(meta,title,style);const header=doc.createElement('header'),name=doc.createElement('strong'),save=doc.createElement('a');name.textContent=entry.name;save.textContent='Download a copy';save.href=url;save.download=entry.name;header.append(name,save);const note=doc.createElement('small');note.textContent=entry.confirmed?'Saved · preview of the exported file.':'Export ready · keep the browser download to save the file.';const main=doc.createElement('main');main.appendChild(previewContent(doc,entry,url));doc.body.replaceChildren(header,note,main);entry.mode='tab';openTabs.add({tab,url});return true;
 }catch(_){if(url)URL.revokeObjectURL(url);try{tab.close();}catch(_){}return false;}}
function openPreview(entry){if(!entry?.kind)return;if(!inTab(entry))inDialog(entry);}
$('lxExportPreviewClose').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{if(!dialog.open)releaseDialog();});$('lxExportPreviewDownload').onclick=()=>{if(dialogEntry)rawDownload(dialogEntry.blob,dialogEntry.name);};$('lxExportPreviewTab').onclick=()=>{if(dialogEntry&&inTab(dialogEntry))dialog.close();};$('lxLastExportPreview').onclick=()=>{if(last)openPreview(last);};$('lxLastExportDownload').onclick=()=>{if(last)rawDownload(last.blob,last.name);};
window.addEventListener('keydown',e=>{if(!dialog.open)return;if((e.ctrlKey||e.metaKey)&&['z','y','d','g'].includes(e.key.toLowerCase())||['Delete','Backspace'].includes(e.key))e.preventDefault();e.stopImmediatePropagation();},true);
setInterval(()=>{for(const item of openTabs){try{if(!item.tab.closed)continue;}catch(_){}URL.revokeObjectURL(item.url);openTabs.delete(item);}},15000);
window.LINKXLExport={download,completed,setEnabled,getInfo:()=>({enabled,last:last?{name:last.name,type:last.blob.type,size:last.blob.size,confirmed:last.confirmed,previewable:!!last.kind,previewMode:last.mode}:null}),previewLast:()=>{if(last)openPreview(last);}};
})();
</script>
