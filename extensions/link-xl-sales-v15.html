<script id="linkXLSales">
(()=>{
'use strict';
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
const defaults={title:'',client:'',clientEmail:'',company:'',contact:'',email:'',phone:'',notes:''};let meta={...defaults},busy=false,activeTab='proposal',draft=null,templatePattern='line',prepared=null;
try{const p=JSON.parse(localStorage.getItem('link-xl-sales-contact-v1')||'null');for(const k of ['company','contact','email','phone'])if(typeof p?.[k]==='string')meta[k]=p[k].slice(0,200);}catch(_){}
const dialog=document.createElement('dialog');dialog.id='lxSalesDialog';dialog.className='lx-sales-dialog';dialog.innerHTML=`<header><div><h2>Sales & customer presentation</h2><p>Prepare a proposal with the design, quantities and images. No pricing is included.</p></div><button type="button" class="lx-sales-close" id="lxSalesClose" aria-label="Close sales tools">×</button></header><nav class="lx-sales-tabs" role="tablist" aria-label="Sales tools"><button type="button" role="tab" id="lxSalesTabProposal" aria-controls="lxSalesProposal" data-tab="proposal" aria-selected="true">Proposal PDF & email</button><button type="button" role="tab" id="lxSalesTabCustomer" aria-controls="lxSalesCustomer" data-tab="customer" aria-selected="false">Customer view</button><button type="button" role="tab" id="lxSalesTabTemplates" aria-controls="lxSalesTemplates" data-tab="templates" aria-selected="false">Ready compositions</button><button type="button" role="tab" id="lxSalesTabPlan" aria-controls="lxSalesPlan" data-tab="plan" aria-selected="false">Floor plan</button></nav>
<section id="lxSalesProposal" class="lx-sales-panel" role="tabpanel"><div class="lx-sales-grid"><label>Proposal / project name<input id="lxSalesTitle" maxlength="140"></label><label>Customer name<input id="lxSalesClient" maxlength="140"></label><label>Customer email (optional)<input id="lxSalesClientEmail" type="email" maxlength="254"></label><label>Company / brand<input id="lxSalesCompany" maxlength="140"></label><label>Sales contact<input id="lxSalesContact" maxlength="140"></label><label>Contact email<input id="lxSalesEmail" type="email" maxlength="254"></label><label>Phone<input id="lxSalesPhone" maxlength="60"></label><label>Proposal scope<select id="lxSalesScope"><option value="current">Current proposal</option><option value="ab">Captured A / B proposals</option></select></label><label class="lx-sales-wide">Description / notes<textarea id="lxSalesNotes" maxlength="3000"></textarea></label></div><div class="lx-sales-actions"><button type="button" id="lxSalesRemember">Remember company contact</button></div><label><input id="lxSalesRoom" type="checkbox" checked> Include room / 3D images</label><label><input id="lxSalesResults" type="checkbox" checked> Include preliminary lighting results and assumptions</label><div class="lx-sales-actions"><button type="button" id="lxSalesPDF">Prepare proposal PDF</button><button type="button" id="lxSalesMail">Email proposal</button></div><p>The PDF includes product codes and quantities. Missing LDT data or incomplete design details are identified rather than treated as confirmed results.</p></section>
<section id="lxSalesCustomer" class="lx-sales-panel" role="tabpanel" hidden><h3>A clean, read-only presentation for the customer</h3><p>Export a self-contained HTML file with the configured 3D, saved views, proposal PDF and product quantities. The customer can orbit the view and compare captured A/B proposals without editing the design.</p><label><input id="lxCustomerContact" type="checkbox" checked> Include the contact details above</label><div class="lx-sales-actions"><button type="button" id="lxCustomerExport">Export customer view · HTML</button><button type="button" id="lxCustomerZip">Export customer package · ZIP</button></div><div class="lx-sales-notice">Uses the proposal name, scope and image/results options from the first tab. A/B uses the captured snapshots. A live shared URL or QR requires hosting; this export works as an offline file.</div></section>
<section id="lxSalesTemplates" class="lx-sales-panel" role="tabpanel" hidden><h3>Start with a ready composition</h3><p>Uses the current installation type, system, finishes and last selected LED specification. Lengths below are straight profile lengths; corners add to the overall dimensions.</p><div class="lx-template-options" id="lxTemplateOptions"></div><div class="lx-sales-grid"><label>Profile length A (mm)<input id="lxTemplateA" type="number" min="300" max="3000" step="1" value="1800"></label><label>Profile length B (mm)<input id="lxTemplateB" type="number" min="300" max="3000" step="1" value="1200"></label><label>Parallel spacing (mm)<input id="lxTemplateSpacing" type="number" min="150" max="5000" step="1" value="700"></label><label>LED modules per profile<input id="lxTemplateModules" type="number" min="1" max="12" step="1" value="3"></label></div><div class="lx-template-preview" id="lxTemplatePreview"></div><p id="lxTemplateInfo" role="status"></p><label><input id="lxTemplateConfirm" type="checkbox"> Replace the current design with this composition. One Undo restores it.</label><div class="lx-sales-actions"><button type="button" id="lxTemplateApply" disabled>Apply composition</button></div><p>Room, floor plan and pendant hardware selections are kept. Check dimensions, suspension/canopy choices and LDT assignments for the new layout.</p></section>
<section id="lxSalesPlan" class="lx-sales-panel" role="tabpanel" hidden><h3>Use a real floor plan as a 2D background</h3><p>Import a PNG, JPG or WebP image, pick two points with a known distance and set the scale in metres. Move or rotate the background to align it with the design.</p><div class="lx-sales-actions"><button type="button" id="lxSalesOpenPlan">Open floor plan tools</button></div><p>The plan is a visual reference. It does not automatically create room walls, furniture or daylight. Configure those dimensions in Create your room.</p></section><p class="lx-sales-status" id="lxSalesStatus" role="status" aria-live="polite"></p>`;document.body.appendChild(dialog);
const emailDialog=document.createElement('dialog');emailDialog.id='lxSalesEmailDialog';emailDialog.className='lx-sales-dialog lx-sales-email';emailDialog.innerHTML='<header><h2>Email proposal</h2><button type="button" class="lx-sales-close" id="lxMailClose" aria-label="Close email preparation">×</button></header><p>Review the recipient and message before opening your email app.</p><label>To<input id="lxMailTo" type="email" maxlength="254" required></label><label>Subject<input id="lxMailSubject" maxlength="180" required></label><label>Message<textarea id="lxMailBody" maxlength="5000"></textarea></label><p class="lx-attachment" id="lxMailAttachment"></p><div class="lx-sales-actions"><button type="button" id="lxMailOpen">Download PDF & open email</button><button type="button" id="lxMailShare" hidden>Share PDF with attachment</button></div><p>Your email app uses its configured account. A mailto draft cannot attach the file automatically: attach the downloaded PDF before sending. Automatic company sending has not been connected.</p><p class="lx-sales-status" id="lxMailStatus" role="status"></p>';document.body.appendChild(emailDialog);
const busyLayer=document.createElement('div');busyLayer.className='lx-sales-busy';busyLayer.id='lxSalesBusy';busyLayer.hidden=true;busyLayer.textContent='Preparing the proposal and images…';document.body.appendChild(busyLayer);
const button=document.createElement('button');button.id='btnSales';button.type='button';button.className='tool lx-entry';button.textContent='Sales';button.title='Proposal PDF, customer presentation, templates and floor plan';$('btnScenario').after(button);
const fields={title:'lxSalesTitle',client:'lxSalesClient',clientEmail:'lxSalesClientEmail',company:'lxSalesCompany',contact:'lxSalesContact',email:'lxSalesEmail',phone:'lxSalesPhone',notes:'lxSalesNotes'};
function status(text,error=false){$('lxSalesStatus').textContent=text;$('lxSalesStatus').dataset.error=String(error);}
function validateMeta(value){if(value==null)return {...defaults};if(typeof value!=='object'||Array.isArray(value))throw new Error('Invalid proposal details.');const out={};for(const [k,id]of Object.entries(fields)){const v=value[k]??'';const max=k==='notes'?3000:k==='phone'?60:['clientEmail','email'].includes(k)?254:140;if(typeof v!=='string'||v.length>max||k!=='notes'&&/[\r\n]/.test(v))throw new Error('Invalid proposal '+k+'.');if(['clientEmail','email'].includes(k)&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))throw new Error('Enter a valid '+k+'.');out[k]=v;}return out;}
function read(){const d=Object.fromEntries(Object.entries(fields).map(([k,id])=>[k,$(id).value.trim()]));meta=validateMeta(d);return clone(meta);}
function fill(){for(const [k,id]of Object.entries(fields))$(id).value=meta[k]||'';}
function setTab(tab){activeTab=tab;for(const b of dialog.querySelectorAll('[data-tab]')){const yes=b.dataset.tab===tab;b.setAttribute('aria-selected',String(yes));b.tabIndex=yes?0:-1;$(b.getAttribute('aria-controls')).hidden=!yes;}if(tab==='templates')previewTemplate();}
function open(){if(busy)return;LINKXLPlan.open(false);if(!$('lxSalesTitle').value)$('lxSalesTitle').value=state.projectName||'LINK XL proposal';const slots=LINKXLScenarios.getSlots();$('lxSalesScope').options[1].disabled=!slots.A||!slots.B;if($('lxSalesScope').options[$('lxSalesScope').selectedIndex].disabled)$('lxSalesScope').value='current';setTab(activeTab);dialog.showModal();}
button.onclick=open;$('lxSalesClose').onclick=()=>dialog.close();for(const b of dialog.querySelectorAll('[data-tab]'))b.onclick=()=>setTab(b.dataset.tab);
dialog.querySelector('[role=tablist]').addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Home','End'].includes(e.key))return;e.preventDefault();const a=[...dialog.querySelectorAll('[data-tab]')],i=a.indexOf(document.activeElement),n=e.key==='Home'?0:e.key==='End'?a.length-1:(i+(e.key==='ArrowRight'?1:-1)+a.length)%a.length;setTab(a[n].dataset.tab);a[n].focus();});
for(const id of Object.values(fields))$(id).addEventListener('input',()=>{prepared=null;});
$('lxSalesRoom').onchange=()=>{$('lxSalesResults').disabled=!$('lxSalesRoom').checked;};$('lxSalesRemember').onclick=()=>{try{const m=read();localStorage.setItem('link-xl-sales-contact-v1',JSON.stringify(Object.fromEntries(['company','contact','email','phone'].map(k=>[k,m[k]]))));status('Company contact saved in this browser. Customer details are kept only in the proposal/scenario.');}catch(e){status(e.message,true);}};
$('lxSalesOpenPlan').onclick=()=>{dialog.close();LINKXLPlan.open();};
const icons={line:'M5 17h60',parallel:'M5 9h60M5 25h60',three:'M5 5h60M5 17h60M5 29h60',l:'M8 5v22h55',u:'M7 5v22h56V5',frame:'M7 5h56v22H7z'};
for(const t of LINKXLTemplates.patterns){const b=document.createElement('button');b.type='button';b.dataset.pattern=t.id;b.setAttribute('aria-pressed',String(t.id==='line'));b.innerHTML='<svg viewBox="0 0 70 34" aria-hidden="true"><path d="'+icons[t.id]+'"/></svg><span></span>';b.lastElementChild.textContent=t.name;b.onclick=()=>{templatePattern=t.id;for(const x of $('lxTemplateOptions').children)x.setAttribute('aria-pressed',String(x===b));$('lxTemplateConfirm').checked=false;previewTemplate();};$('lxTemplateOptions').appendChild(b);}
function templateSpec(){return {pattern:templatePattern,a:$('lxTemplateA').value,b:$('lxTemplateB').value,spacing:$('lxTemplateSpacing').value,modules:$('lxTemplateModules').value};}
function previewTemplate(){try{draft=LINKXLTemplates.generate(templateSpec());$('lxTemplatePreview').innerHTML=draft.svg;$('lxTemplateInfo').textContent=`${LINK_TYPE_LABEL[TYPE]} · ${SYSTEMS[state.system]} · ${Math.round(draft.width)} × ${Math.round(draft.height)} mm overall · ${draft.profiles} profiles / ${draft.corners} corners / ${draft.modules} LED modules`;$('lxTemplateInfo').style.color='';}catch(e){draft=null;$('lxTemplatePreview').replaceChildren();$('lxTemplateInfo').textContent=e.message;$('lxTemplateInfo').style.color='#9a322d';}$('lxTemplateApply').disabled=!draft||!$('lxTemplateConfirm').checked;}
for(const id of ['lxTemplateA','lxTemplateB','lxTemplateSpacing','lxTemplateModules'])$(id).oninput=()=>{$('lxTemplateConfirm').checked=false;previewTemplate();};$('lxTemplateConfirm').onchange=()=>{$('lxTemplateApply').disabled=!draft||!$('lxTemplateConfirm').checked;};$('lxTemplateApply').onclick=()=>{if(!draft||!$('lxTemplateConfirm').checked)return;try{LINKXLTemplates.apply(templateSpec());dialog.close();}catch(e){status(e.message,true);}};
function filename(v){return (v||'LINK_XL_Proposal').replace(/[^\p{L}\p{N}_ -]/gu,'').trim().replace(/\s+/g,'_').slice(0,100)||'LINK_XL_Proposal';}
async function withBusy(fn){if(busy)return;const reopen=dialog.open;busy=true;if(reopen)dialog.close();const inert=$('lxRoom').inert;$('lxRoom').inert=true;busyLayer.hidden=false;try{return await fn();}catch(e){status(e.message,true);toast(e.message);throw e;}finally{busy=false;busyLayer.hidden=true;$('lxRoom').inert=inert;if(reopen&&!dialog.open)dialog.showModal();}}
async function pngDrawing(){const selected=state.selectedId,multi=state.multi,measure=state.measureMode;state.selectedId=null;state.multi=[];state.measureMode=false;render();let children;try{children=[...scene.childNodes].map(n=>n.cloneNode(true));}finally{state.selectedId=selected;state.multi=multi;state.measureMode=measure;render();}const ids=[...state.profiles,...state.corners,...state.endcaps,...state.modules,...state.blanks].map(x=>x.id);let b=designBounds(ids)||{x0:0,y0:0,x1:1000,y1:600};const plan=LINKXLPlan.exportState();if(plan?.visible){const p=[[0,0],[plan.width,0],[plan.width,plan.height],[0,plan.height]].map(([x,y])=>LINKXLPlan.pointToWorld({x,y}));b={x0:Math.min(b.x0,...p.map(q=>q.x)),y0:Math.min(b.y0,...p.map(q=>q.y)),x1:Math.max(b.x1,...p.map(q=>q.x)),y1:Math.max(b.y1,...p.map(q=>q.y))};}const padding=Math.max(220,Math.max(b.x1-b.x0,b.y1-b.y0)*.16);const iw=1400,ih=Math.max(400,Math.min(1200,iw*(b.y1-b.y0+2*padding)/(b.x1-b.x0+2*padding))),scale=Math.min((iw-30)/(b.x1-b.x0+2*padding),(ih-30)/(b.y1-b.y0+2*padding)),px=iw/2-(b.x0+b.x1)/2*scale,py=ih/2-(b.y0+b.y1)/2*scale;const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('xmlns','http://www.w3.org/2000/svg');svg.setAttribute('width',iw);svg.setAttribute('height',ih);const style=document.createElementNS(svg.namespaceURI,'style');const cs=getComputedStyle(document.documentElement);style.textContent=':root{'+[...cs].filter(k=>k.startsWith('--')).map(k=>k+':'+cs.getPropertyValue(k)).join(';')+'}';svg.appendChild(style);const defs=children.find(n=>n.nodeName==='defs');if(defs)svg.appendChild(defs);const g=document.createElementNS(svg.namespaceURI,'g'),r=scale/state.scale;g.setAttribute('transform',`translate(${px-r*state.panX} ${py-r*state.panY}) scale(${r})`);for(const child of children)if(child!==defs&&!(child.nodeType===1&&child.hasAttribute('data-plan-marker')))g.appendChild(child);svg.appendChild(g);const blob=new Blob([new XMLSerializer().serializeToString(svg)],{type:'image/svg+xml'}),url=URL.createObjectURL(blob);try{const im=await new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image);image.onerror=()=>reject(new Error('Design image could not be prepared.'));image.src=url;});const cv=document.createElement('canvas');cv.width=iw;cv.height=ih;const ctx=cv.getContext('2d');ctx.fillStyle='white';ctx.fillRect(0,0,iw,ih);ctx.drawImage(im,0,0);return cv.toDataURL('image/png');}finally{URL.revokeObjectURL(url);}}
function collectBOM(){const old=BOM_FLAT;BOM_FLAT=true;try{return bomData().filter(r=>!r.sec&&!r.sub).map(({code,model,model2,qty,len,color,dim,tag})=>({code,model,model2,qty,len,color,dim,tag}));}finally{BOM_FLAT=old;}}
async function itemData(label,includeRoom,includeResults){const ids=[...state.profiles,...state.corners].map(x=>x.id),b=designBounds(ids);if(!b)throw new Error('Add a luminaire design before preparing a proposal.');const item={label,type:TYPE,typeLabel:LINK_TYPE_LABEL[TYPE],width:b.x1-b.x0,height:b.y1-b.y0,bom:collectBOM(),drawing:await pngDrawing(),planNote:LINKXLPlan.getInfo().loaded?(LINKXLPlan.getInfo().calibrated?'Calibrated floor plan reference included.':'Floor plan scale is not set: placement is indicative.'):'',issues:designIssues().grand||0,bundle:includeRoom?await LINKXL3D.capturePresentation(includeResults):null};return item;}
async function prepare(){const m=read(),room=$('lxSalesRoom').checked,results=room&&$('lxSalesResults').checked,scope=$('lxSalesScope').value,items=[];if(scope==='ab'){const slots=LINKXLScenarios.getSlots();if(!slots.A||!slots.B)throw new Error('Capture both A and B first.');for(const key of ['A','B'])items.push(await LINKXLScenarios.withScenario(slots[key].snapshot,()=>itemData(key+' · '+slots[key].snapshot.name,room,results)));}else items.push(await itemData(m.title||state.projectName||'Current proposal',room,results));const doc=proposalPDF(m,items),blob=doc.output('blob'),name=filename(m.title||state.projectName)+'_proposal.pdf';return {meta:m,items,blob,name};}
function pdfBase(m){const pdf=new LINKXLReportEngine.jsPDF({unit:'mm',format:'a4',compress:true});pdf.addFileToVFS('Sales.ttf',LINKXLReportFonts.regular);pdf.addFont('Sales.ttf','Sales','normal');pdf.addFileToVFS('SalesBold.ttf',LINKXLReportFonts.bold);pdf.addFont('SalesBold.ttf','Sales','bold');pdf.setFont('Sales');pdf.setProperties({title:'LINK XL · Proposal',author:m.company||'LINK XL Configurator',subject:'Design, quantities and indicative lighting proposal'});return pdf;}
function proposalPDF(m,items){const p=pdfBase(m);let y=20;const width=174;function ensure(h){if(y+h>276){p.addPage();y=20;}}function text(v,size=9,bold=false){p.setFont('Sales',bold?'bold':'normal');p.setFontSize(size);p.setTextColor(38,53,65);const lines=p.splitTextToSize(String(v||''),width);const h=lines.length*size*.43;ensure(h+4);p.text(lines,18,y);y+=h+4;}function image(data,maxh=90){if(!data)return;const a=p.getImageProperties(data),h=Math.min(maxh,width*a.height/a.width),w=h*a.width/a.height;ensure(h+8);p.addImage(data,data.startsWith('data:image/png')?'PNG':'JPEG',18+(width-w)/2,y,w,h);y+=h+7;}function page(title){p.addPage();y=20;text(title,16,true);}function table(rows){const widths=[37,95,15,27];const headers=['Code','Item / specification','Qty','Length (mm)'];let all=[headers,...rows.map(r=>[r.code||'—',[r.model,r.model2,r.color,r.dim].filter(Boolean).join(' · '),r.qty,r.len||'—'])];for(let i=0;i<all.length;i++){p.setFont('Sales',i===0?'bold':'normal');p.setFontSize(8);const cells=all[i].map((v,j)=>p.splitTextToSize(String(v),widths[j]-4)),h=Math.max(...cells.map(v=>v.length))*3.6+6;ensure(h);if(i===0){p.setFillColor(239,244,247);p.rect(18,y-3,width,h,'F');}let x=18;for(let j=0;j<4;j++){p.setTextColor(38,53,65);p.text(cells[j],x+2,y+1);x+=widths[j];}p.setDrawColor(224,230,234);p.line(18,y+h-4,192,y+h-4);y+=h;}y+=5;}
 text(m.company||'LINK XL',12,true);text(m.title||'Πρόταση φωτιστικού',21,true);if(m.client)text('Πελάτης · '+m.client,11);text(new Date().toLocaleDateString('el-GR',{timeZone:'Europe/Athens'}));const contact=[m.contact,m.email,m.phone].filter(Boolean).join(' · ');if(contact)text(contact);if(m.notes)text(m.notes);text('Σύνθεση, ποσότητες και εικόνες πρότασης',11,true);image(items[0].bundle?.roomImage||items[0].drawing,100);if(items.length>1)text('Περιλαμβάνονται '+items.length+' εναλλακτικές προτάσεις.');
