<script id="linkXLWorkspace">
(()=>{
'use strict';
const $=id=>document.getElementById(id),clone=x=>JSON.parse(JSON.stringify(x));
let filter='all',signature='',refreshFrame=0;
const kind=id=>itemKind(id),locked=()=>state.lockedIds||[];
function directLocked(id){return locked().includes(id)||locked().includes(pcOf(id))||!!grpOfId(pcOf(id))&&groupMembers(grpOfId(pcOf(id))).some(x=>locked().includes(x));}
function canEdit(ids,quiet=false){const affected=new Set(ids||[]);for(const id of ids||[])if(kind(id)==='profile'){for(const m of [...state.modules,...state.blanks])if(m.host===id)affected.add(m.id);for(const c of capsOnProfile(findItem(id)))affected.add(c.cap.id);}const blocked=[...affected].some(directLocked);if(blocked&&!quiet)toast('Selection contains locked items. Unlock them in Properties first.');return !blocked;}
function matchesFilter(id){return filter==='all'||kind(id)==={profiles:'profile',modules:'module',corners:'corner'}[filter];}
function idAt(clientX,clientY,raw){const r=scene.getBoundingClientRect(),x=sxToMm(clientX-r.left),y=syToMm(clientY-r.top),cache=buildRuns(),contains=id=>designItemRects(id,cache).some(b=>x>=b.x-.1&&x<=b.x+b.w+.1&&y>=b.y-.1&&y<=b.y+b.h+.1);const modules=state.modules.slice().reverse().find(m=>contains(m.id));if(modules)return modules.id;if(raw&&contains(raw))return raw;for(const it of [...state.blanks,...state.endcaps,...state.corners,...state.profiles].slice().reverse())if(contains(it.id))return it.id;return null;}
function resolve(id){if(filter==='profiles'&&id&&!isPC(id))id=pcOf(id);return id&&matchesFilter(id)?id:null;}
function pick(raw,{shift=false,alt=false}={}){if(alt&&filter==='all'&&['module','blank'].includes(kind(raw)))raw=pcOf(raw);const id=resolve(raw);if(!id){if(!shift)clearSelection();syncUI();render();return;}let ids=[id];if(filter==='all'&&isPC(id)&&!alt&&grpOfId(id))ids=groupMembers(grpOfId(id));if(shift){const before=designSelectionIds(),remove=ids.every(x=>before.includes(x));ids=remove?before.filter(x=>!ids.includes(x)):[...before,...ids];}selectDesignIds(ids,id);lastClickId=null;closeEditor();syncUI();render();}
function setFilter(value){filter=['all','profiles','modules','corners'].includes(value)?value:'all';$('lxSelectionFilter').value=filter;selectDesignIds(designSelectionIds().filter(matchesFilter));lastClickId=null;syncUI();render();}
function toggleLock(){let ids=designSelectionIds();if(!ids.length)return;const expanded=new Set(ids);for(const id of ids){const gid=grpOfId(pcOf(id));if(gid)for(const member of groupMembers(gid))expanded.add(member);}const unlock=ids.some(directLocked);pushHistory();if(unlock){for(const id of ids){expanded.add(pcOf(id));const gid=grpOfId(pcOf(id));if(gid)for(const member of groupMembers(gid))expanded.add(member);}state.lockedIds=locked().filter(id=>!expanded.has(id));}else state.lockedIds=[...new Set([...locked(),...expanded])];syncUI();render();}
const props=document.createElement('details');props.id='lxProperties';props.open=true;props.innerHTML='<summary>Properties</summary><label>Selection filter<select id="lxSelectionFilter"><option value="all">All items</option><option value="profiles">Profiles</option><option value="modules">LED modules</option><option value="corners">Corners / connectors</option></select></label><div id="lxPropertyBody"></div>';$('itembar').querySelector('.ib-in').prepend(props);$('lxSelectionFilter').onchange=e=>setFilter(e.target.value);
const body=$('lxPropertyBody');
function common(items,key){return items.every(x=>x[key]===items[0][key])?items[0][key]:'';}
function intersection(sets){return sets.length?sets[0].filter(x=>sets.every(a=>a.includes(x))):[];}
function field(label,key,values,value){const row=document.createElement('label');row.textContent=label;const input=document.createElement(Array.isArray(values)?'select':'input');input.name=key;if(Array.isArray(values)){const first=document.createElement('option');first.value='';first.textContent=value===''?'Mixed · keep each value':'Keep current';input.appendChild(first);for(const v of values){const o=document.createElement('option');o.value=String(v);o.textContent=String(v);input.appendChild(o);}input.value=String(value??'');}else{input.type='number';input.min='50';input.max=String(MAX_PROFILE_LEN);input.step='1';input.value=value;input.placeholder='Mixed · keep each value';}row.appendChild(input);return row;}
function refreshProperties(force=false){const ids=designSelectionIds(),items=ids.map(findItem).filter(Boolean),sig=JSON.stringify([ids,items,locked(),filter]);if(!force&&sig===signature)return;signature=sig;body.replaceChildren();const title=document.createElement('b');title.textContent=ids.length?`${ids.length} selected · ${[...new Set(ids.map(kind))].join(' / ')}`:'Select an item';body.appendChild(title);if(!ids.length){const note=document.createElement('p');note.className='lx-prop-note';note.textContent='Click an item or drag a selection window. Locking keeps items selectable and protects their geometry.';body.appendChild(note);return;}
 const lockedNow=ids.some(directLocked),actions=document.createElement('div');actions.className='lx-prop-actions';const lock=document.createElement('button');lock.type='button';lock.id='lxLockSelection';lock.textContent=lockedNow?'Unlock selection':'Lock selection';lock.onclick=toggleLock;actions.appendChild(lock);if(ids.length===1){const edit=document.createElement('button');edit.type='button';edit.textContent='Full editor';edit.disabled=lockedNow;edit.onclick=()=>editItem(ids[0]);actions.appendChild(edit);}body.appendChild(actions);
 if(lockedNow){const p=document.createElement('p');p.className='lx-prop-note';p.textContent='Locked · selection and navigation remain available. Unlock to move, edit or delete.';body.appendChild(p);return;}
 const form=document.createElement('form');form.id='lxPropertyForm';const onlyPC=ids.every(isPC),onlyProfiles=ids.every(id=>kind(id)==='profile'),onlyModules=ids.every(id=>kind(id)==='module');
 if(onlyProfiles)form.appendChild(field('Profile length (mm)','length',null,common(items,'length')));
 if(onlyPC){const colors=intersection(items.map(x=>kind(x.id)==='profile'?colorsFor(x.system):Object.keys(CORNER_CODES).filter(k=>k.startsWith(x.system+'|'+x.kind+'|')).map(k=>k.split('|')[2]))).filter(c=>c!=='Custom Colour');if(colors.length)form.appendChild(field('Finish','color',colors,common(items,'color')));}
 if(onlyModules){const ccts=intersection(items.map(m=>ledType(m).ccts||[]));if(ccts.length)form.appendChild(field('CCT','cct',ccts,common(items,'cct')));const beams=intersection(items.map(m=>ledType(m).beams||[]));if(beams.length)form.appendChild(field('Optics / beam','beam',beams,common(items,'beam')));const dims=intersection(items.map(m=>dimOptionsFor(ledType(m),m.cct,ledLen(m))));if(dims.length)form.appendChild(field('Driver / dimming','dimming',dims,common(items,'dimming')));}
 if(form.children.length){const note=document.createElement('p');note.className='lx-prop-note';note.textContent='Apply changes to the whole selection. Incompatible combinations or lengths that leave modules outside their run are rejected together.';form.appendChild(note);const apply=document.createElement('button');apply.type='submit';apply.textContent='Apply properties';apply.id='lxApplyProperties';form.appendChild(apply);form.onsubmit=e=>{e.preventDefault();const changes={};for(const input of form.querySelectorAll('[name]'))if(input.value!=='')changes[input.name]=input.name==='length'?Number(input.value):input.value;try{applyProperties(changes);}catch(err){toast(err.message);}};body.appendChild(form);}else{const p=document.createElement('p');p.className='lx-prop-note';p.textContent='No common editable fields for this selection. Select one item for its full editor.';body.appendChild(p);}
}
function applyProperties(changes){const ids=designSelectionIds();if(!ids.length||!canEdit(ids))return false;const allowed=['length','color','cct','beam','dimming'];if(Object.keys(changes).some(k=>!allowed.includes(k)))throw new Error('Unsupported property.');const invalidBefore=new Set(state.modules.filter(m=>moduleHangs(m)).map(m=>m.id));const keys=['profiles','corners','endcaps','modules','blanks'],before=Object.fromEntries(keys.map(k=>[k,state[k]]));for(const k of keys)state[k]=clone(state[k]);let after;
 try{for(const id of ids){const it=findItem(id),k=kind(id);for(const [key,value]of Object.entries(changes)){
  if(key==='length'){if(k!=='profile'||!Number.isInteger(value)||value<50||value>MAX_PROFILE_LEN)throw new Error('Enter a valid profile length.');const caps=capsOnProfile(it),d=value-it.length;if(d&&((it.rot||0)%180)!==0){it.x-=d/2;it.y+=d/2;}it.length=value;syncCapsToProfile(it,caps);}
  if(key==='color'){const opts=k==='profile'?colorsFor(it.system):Object.keys(CORNER_CODES).filter(x=>x.startsWith(it.system+'|'+it.kind+'|')).map(x=>x.split('|')[2]);if(!isPC(id)||!opts.includes(value)||value==='Custom Colour')throw new Error('Finish is not available for every selected part.');it.color=value;}
  if(['cct','beam','dimming'].includes(key)){if(k!=='module')throw new Error('Select LED modules for this property.');const t=ledType(it),opts=key==='cct'?t.ccts:key==='beam'?t.beams:dimOptionsFor(t,it.cct,ledLen(it));if(!opts?.includes(value))throw new Error('The selected value is not available for every module.');if(key==='cct'){const old=ledWL(it),arr=wlArrayFor(t,value),index=arr.findIndex(w=>w.len===old.len&&w.w===old.w);if(index<0)throw new Error('This CCT uses a different output / length. Use the full module editor.');it.wl=index;}it[key]=value;}
 }}
 for(const m of state.modules){if(changes.length!=null&&moduleHangs(m)&&!invalidBefore.has(m.id))throw new Error('A module would extend outside its profile.');if(ids.includes(m.id)&&!dimOptionsFor(ledType(m),m.cct,ledLen(m)).includes(m.dimming))throw new Error('CCT and driver are incompatible.');}
 if(changes.length!=null){const cache=buildRuns();for(const m of state.modules){const w=moduleWorld(m,cache);if(w&&runObstacles(w.run,m.id,cache).some(o=>o.start<w.startAbs+w.len-.01&&o.start+o.len>w.startAbs+.01))throw new Error('The new length would overlap modules or blanks.');}if(groupHits(ids,obstaclesExcept(new Set(ids))))throw new Error('The new length overlaps another part.');}
 reflowBlanks();after=Object.fromEntries(keys.map(k=>[k,state[k]]));
 }finally{Object.assign(state,before);}
 if(JSON.stringify(after)===JSON.stringify(before))return true;pushHistory();Object.assign(state,after);syncUI();render();return true;
}
function refresh(){refreshFrame=0;refreshProperties();for(const el of scene.querySelectorAll('.lx-lock-mark'))el.remove();const cache=buildRuns();for(const id of locked()){const rect=designItemRects(id,cache)[0];if(!rect)continue;const g=el('g',{'class':'lx-lock-mark','aria-label':'Locked item'});g.appendChild(el('circle',{cx:mmToSx(rect.x)+7,cy:mmToSy(rect.y)-6,r:5,fill:'#73818b',stroke:'white','stroke-width':1}));scene.appendChild(g);}}
const oldRender=render;render=function(){oldRender();if(!refreshFrame)refreshFrame=requestAnimationFrame(refresh);};
window.addEventListener('pointerdown',e=>{
 if(e.button!==0||!scene.contains(e.target)||state.measureMode||window.LINKXLNavigation?.isPanning)return;
 const groupTarget=e.target.closest?.('g[data-gid]');if(groupTarget&&filter!=='all'){e.preventDefault();e.stopImmediatePropagation();const members=groupMembers(groupTarget.dataset.gid).filter(matchesFilter);selectDesignIds(e.shiftKey?[...designSelectionIds(),...members]:members);syncUI();render();return;}
 const domId=e.target.closest?.('g[data-id]')?.dataset.id,raw=idAt(e.clientX,e.clientY,domId),id=resolve(raw);if(!raw&&!domId)return;
 if(id&&(!canEdit(designSelectionIds().includes(id)?designSelectionIds():[id],true))){e.preventDefault();e.stopImmediatePropagation();pick(id,{shift:e.shiftKey,alt:e.altKey});return;}
 if(filter==='all'&&raw===domId)return;
 if(!id){e.preventDefault();e.stopImmediatePropagation();const r=scene.getBoundingClientRect();startMarquee(e.clientX-r.left,e.clientY-r.top,e.shiftKey,true,e.pointerId);try{scene.setPointerCapture(e.pointerId);}catch(_){}return;}
 if(id!==domId){const target=scene.querySelector('g[data-id="'+CSS.escape(id)+'"]');e.preventDefault();e.stopImmediatePropagation();target?.dispatchEvent(new PointerEvent('pointerdown',{bubbles:true,composed:true,pointerId:e.pointerId,pointerType:e.pointerType,clientX:e.clientX,clientY:e.clientY,button:e.button,buttons:e.buttons,shiftKey:e.shiftKey,altKey:e.altKey}));}
},true);
window.LINKXLWorkspace={idAt,canEdit,matchesFilter,pick,setFilter,toggleLock,applyProperties,refresh:()=>refreshProperties(true),get filter(){return filter;},get locks(){return locked().slice();}};
refresh();
})();
</script>
