<script id="linkXLTemplates">
(()=>{
'use strict';
const clone=x=>JSON.parse(JSON.stringify(x));
const patterns=[{id:'line',name:'Straight line',turns:[],lengths:['a']},{id:'parallel',name:'Parallel lines',parallel:2},{id:'three',name:'Three parallel lines',parallel:3},{id:'l',name:'L composition',turns:[[0,1]],lengths:['a','b']},{id:'u',name:'U composition',turns:[[0,1],[-1,0]],lengths:['a','b','a']},{id:'frame',name:'Closed frame',turns:[[0,1],[-1,0],[0,-1],[1,0]],lengths:['a','b','a','b']}];
function generate(input){const previousType=TYPE,preferences={};for(const k of ['system','color','cornerColor','capColor','blankColor','blankKeep'])preferences[k]={present:Object.hasOwn(state,k),value:state[k]};const targetType=input.type||TYPE;if(!LINK_TYPES.includes(targetType))throw new Error('Choose an installation type.');try{applyType(targetType);if(input.system){if(!Object.hasOwn(SYSTEMS,input.system))throw new Error('Choose a compatible profile system.');state.system=input.system;}normalizeTypeDefaults();return generateCurrent(input);}finally{applyType(previousType);for(const [k,v]of Object.entries(preferences)){if(v.present)state[k]=v.value;else delete state[k];}}}
function validModule(m){if(m?.blank===true)return {blank:true};if(!m||!LED_TYPES[m.type])throw new Error('Choose a LED module for every position.');const t=LED_TYPES[m.type],o={type:m.type};for(const slot of t.slots){if(slot==='cri')continue;if(COMPOSITES[slot]){for(const part of COMPOSITES[slot].parts){if(!part.options.includes(m[part.key]))throw new Error('Invalid '+part.label+'.');o[part.key]=m[part.key];}}else if(slot==='wl'){const list=wlArrayFor(t,m.cct);if(!Number.isInteger(m.wl)||!list[m.wl])throw new Error('Choose a valid module length.');o.wl=m.wl;}else{if(!slotOptions(t,slot).includes(m[slot]))throw new Error('Choose a valid '+(SLOT_LABEL[slot]||slot)+'.');o[slot]=m[slot];}}if(!dimOptionsFor(t,m.cct,ledLen(o)).includes(m.dimming))throw new Error('Choose compatible dimming.');o.dimming=m.dimming;return o;}
function generateCurrent(input){const spec={pattern:String(input.pattern),a:Number(input.a),b:Number(input.b),spacing:Number(input.spacing),modules:Number(input.modules)};const pattern=patterns.find(p=>p.id===spec.pattern);if(!pattern)throw new Error('Choose a template.');for(const key of ['a','b'])if(!Number.isInteger(spec[key])||spec[key]<300||spec[key]>MAX_PROFILE_LEN)throw new Error('Profile lengths must be between 300 and '+MAX_PROFILE_LEN+' mm.');if(!Number.isFinite(spec.spacing)||spec.spacing<150||spec.spacing>5000)throw new Error('Line spacing must be 150–5000 mm.');if(!Number.isInteger(spec.modules)||spec.modules<1||spec.modules>12)throw new Error('Choose 1–12 modules per straight profile.');
 const keys=['profiles','corners','modules','blanks','endcaps','groups','measures','multi','selectedId','lockedIds','seq'];const keep=Object.fromEntries(keys.map(k=>[k,state[k]]));const oldBounds=designBounds(keep.profiles.concat(keep.corners).map(x=>x.id));const draft={profiles:[],corners:[],modules:[],blanks:[],endcaps:[],groups:[],measures:[],multi:[],selectedId:null,lockedIds:[],seq:state.seq};let result;const slots=[];
 try{Object.assign(state,draft);const color=profileColorFix(effColor(state.color,state.customColor)),cornerColor=effColor(state.cornerColor,state.cornerCustomColor),unusedSeed=null;
 const newProfile=(length,dir,port=null)=>{const p={id:'p'+state.seq++,system:state.system,color,length,rot:dir[1]===0?(dir[0]>0?0:180):(dir[1]>0?90:270),x:0,y:0,tag:'TR'+String(state.profiles.length+1).padStart(2,'0')};if(port){const own=profilePorts(p).find(q=>q.nx*dir[0]+q.ny*dir[1]<-.99);if(!own)throw new Error('Profile connection could not be resolved.');p.x+=port.cx-own.cx;p.y+=port.cy-own.cy;}state.profiles.push(p);return p;};
 const bend=(incoming,out)=>{for(const rot of [0,90,180,270]){const c={id:'c'+state.seq,kind:'lcorner',system:state.system,color:cornerColor,x:0,y:0,rot};const ports=cornerPorts(c),a=ports.find(p=>p.nx*incoming.nx+p.ny*incoming.ny<-.99),b=ports.find(p=>p.nx*out[0]+p.ny*out[1]>.99);if(a&&b&&a!==b){state.seq++;c.x+=incoming.cx-a.cx;c.y+=incoming.cy-a.cy;state.corners.push(c);return cornerPorts(c).find(p=>p.nx*out[0]+p.ny*out[1]>.99);}}throw new Error('The selected corner cannot connect this template.');};
 if(pattern.parallel){for(let i=0;i<pattern.parallel;i++){const p=newProfile(spec.a,[1,0]);p.y=i*spec.spacing;}}
 else{let dir=[1,0],p=newProfile(spec[pattern.lengths[0]],dir);const first=profilePorts(p).find(q=>q.nx<-.99);for(let i=0;i<pattern.turns.length;i++){const incoming=profilePorts(p).find(q=>q.nx*dir[0]+q.ny*dir[1]>.99),out=pattern.turns[i],port=bend(incoming,out);if(i+1<pattern.lengths.length)p=newProfile(spec[pattern.lengths[i+1]],out,port);else if(Math.hypot(port.cx-first.cx,port.cy-first.cy)>.05)throw new Error('Frame does not close with these profile dimensions.');dir=out;}}
 const structural=[...state.profiles,...state.corners],bounds=designBounds(structural.map(x=>x.id));const cx=oldBounds?(oldBounds.x0+oldBounds.x1)/2:sxToMm(W/2),cy=oldBounds?(oldBounds.y0+oldBounds.y1)/2:syToMm(H/2),dx=cx-(bounds.x0+bounds.x1)/2,dy=cy-(bounds.y0+bounds.y1)/2;
 for(const p of structural){p.x+=dx;p.y+=dy;}
 const cache=buildRuns();for(const [pi,p]of state.profiles.entries()){const chosen=Array.from({length:spec.modules},(_,k)=>{const v=input.assignments?.[pi*spec.modules+k];return v==null?null:validModule(v);});const fixed=chosen.reduce((sum,m)=>sum+(m&&!m.blank?ledLen(m):0),0),empty=chosen.filter(m=>!m||m.blank).length,placeholder=empty?Math.min(280,Math.max(0,p.length-fixed)/(empty+1)*.55):0,lengths=chosen.map(m=>m&&!m.blank?ledLen(m):placeholder);const used=lengths.reduce((a,b)=>a+b,0);if(used>p.length+.01)throw new Error(`The selected modules do not fit profile ${pi+1}: ${Math.round(used)} mm in ${p.length} mm. Choose shorter modules or increase the profile length.`);const run=runOfProfile(p.id,cache),mem=run.members.find(q=>q.id===p.id),gap=(p.length-used)/(spec.modules+1);let cursor=mem.start+gap;for(let k=0;k<spec.modules;k++){const choice=chosen[k],length=lengths[k],index=pi*spec.modules+k,rect=run.orient==='H'?{x:cursor,y:run.coord,w:length,h:44}:{x:run.coord,y:cursor,w:44,h:length};slots.push({index,profile:pi+1,position:k+1,label:`P${pi+1} · ${k+1}`,choice,length,rect});if(choice&&!choice.blank){const m={...choice,id:'m'+state.seq++,host:p.id,local:0,tag:'L'+String(state.modules.length+1).padStart(2,'0')};rehostModule(m,run,cursor);state.modules.push(m);}cursor+=length+gap;}}
 for(const pt of freeProfileEnds(null))state.endcaps.push({id:'e'+state.seq++,color:state.capColor,cx:pt.cx,cy:pt.cy,dir:[pt.nx,pt.ny],system:pt.system});
 const runs=buildRuns();for(const run of runs){const obs=runObstacles(run,null,runs).slice().sort((a,b)=>a.start-b.start);let a=run.origin;const fill=(start,end)=>{if(end-start<.5)return;const b={id:'b'+state.seq++,host:run.members[0].id,local:0,color:state.blankColor};rehostModule(b,run,(start+end)/2);state.blanks.push(b);};for(const o of obs){fill(a,o.start);a=Math.max(a,o.start+o.len);}fill(a,run.origin+run.length);}
 if(state.modules.some(m=>moduleHangs(m)))throw new Error('Template would leave a module outside its run.');
 const group={id:'g'+state.seq++,name:pattern.name};state.groups=[group];for(const p of structural)p.grp=group.id;state.multi=structural.map(p=>p.id);state.selectedId=state.multi[0];
 const box=designBounds(structural.map(p=>p.id)),width=box.x1-box.x0,height=box.y1-box.y0,margin=Math.max(width,height)*.1+30;let shapes='';for(const p of structural)for(const r of designItemRects(p.id,runs))shapes+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="#b8c4cc" stroke="#526877" stroke-width="2"/>`;for(const slot of slots){const r=slot.rect;shapes+=`<g data-slot="${slot.index}" tabindex="0" role="button" aria-label="Choose module ${slot.label}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" fill="${slot.choice?(slot.choice.blank?'#d5dce1':'#e6b13b'):'#fef9e9'}" stroke="#9b7828" stroke-width="3" ${slot.choice?'':'stroke-dasharray="12 8"'}/><text x="${r.x+r.w/2}" y="${r.y+r.h/2}" text-anchor="middle" dominant-baseline="middle" font-family="Arial" font-size="22" fill="#3b4145">${slot.index+1}</text></g>`;}

 const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="${box.x0-margin} ${box.y0-margin} ${width+2*margin} ${height+2*margin}" role="img" aria-label="${pattern.name} template preview">${shapes}</svg>`;result={name:pattern.name,type:TYPE,system:state.system,model:Object.fromEntries(keys.map(k=>[k,clone(state[k])])),width,height,preferences:Object.fromEntries(['system','color','cornerColor','capColor','blankColor','blankKeep'].filter(k=>Object.hasOwn(state,k)).map(k=>[k,clone(state[k])])),slots,unassigned:slots.filter(x=>!x.choice).length,profiles:state.profiles.length,corners:state.corners.length,modules:state.modules.length,svg};
 }finally{Object.assign(state,keep);}return result;
}
function apply(input){const d=generate(input);if(d.unassigned)throw new Error('Choose a module or Blank for every numbered position.');pushHistory();applyType(d.type);Object.assign(state,d.preferences,d.model);normalizeTypeDefaults();dropPendantParts();closeEditor();leaveMeasureMode();refreshTypeUI();fitView();render();toast(d.name+' applied · Undo restores the previous design.');return d;}
function systems(type){const previous=TYPE;try{applyType(type);return clone(SYSTEMS);}finally{applyType(previous);}}

window.LINKXLTemplates={validModule,systems,patterns:patterns.map(({id,name})=>({id,name})),generate,apply};
})();
</script>
