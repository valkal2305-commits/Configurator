<script id="linkXLScenarios">
(()=>{
'use strict';
const $=id=>document.getElementById(id),copy=x=>JSON.parse(JSON.stringify(x)),slots={A:null,B:null};
let busy=false;const defaultState=copy(state);
const dlg=document.createElement('dialog');dlg.id='lxScenarioDialog';dlg.className='lx-workspace-dialog';dlg.innerHTML=`<header><div><h2>Scenarios & reports</h2><p class="lx-scenario-help">Design, room, furniture, planes, LDT, observer, background and dimming in one portable file.</p></div><button id="lxScenarioClose" type="button" aria-label="Close scenarios">×</button></header><label>Scenario name <input id="lxScenarioName" type="text" maxlength="100" placeholder="Project / room / proposal"></label><div class="lx-scenario-actions"><button type="button" id="lxScenarioSave">Save full scenario</button><button type="button" id="lxScenarioOpen">Open full scenario</button><button type="button" id="lxScenarioPDF">Room PDF</button></div><p class="lx-scenario-help">The original Save / Open keeps the drawing format. Use Full scenario to transfer the room and photometry as well.</p><input id="lxScenarioFile" type="file" accept=".json,application/json" hidden><h3>Compare A / B</h3><p class="lx-scenario-help">Capture A, change the layout or dim level, then capture B. Each column keeps its own settings, LDT and fresh calculation. Saved full scenarios also include these two captures.</p><div class="lx-scenario-actions"><button type="button" id="lxCaptureA">Capture current as A</button><button type="button" id="lxCaptureB">Capture current as B</button><button type="button" id="lxApplyA" disabled>Apply A</button><button type="button" id="lxApplyB" disabled>Apply B</button><button type="button" id="lxRecalculateAB" disabled>Recalculate A / B</button><button type="button" id="lxComparePDF" disabled>Comparison PDF</button></div><div id="lxComparison"></div><p class="lx-workspace-status" id="lxScenarioStatus" role="status" aria-live="polite"></p>`;document.body.appendChild(dlg);
const busyPanel=document.createElement('div');busyPanel.id='lxScenarioBusy';busyPanel.hidden=true;busyPanel.textContent='Calculating room and preparing images…';$('lxRoom').appendChild(busyPanel);
const entry=document.createElement('button');entry.type='button';entry.id='btnScenario';entry.className='tool lx-entry';entry.textContent='Scenarios';entry.title='Full scenario files, A/B comparison and room PDF';$('btnCreateRoom').after(entry);
const section=document.createElement('section');section.className='lx-section';section.innerHTML='<h3><b>06</b> Scenarios & report</h3><div class="lx-photo-buttons"><button type="button" class="lx-mini" id="lxRoomScenarios">Save / compare A·B</button><button type="button" class="lx-mini" id="lxRoomPDF">Room PDF</button></div><p class="lx-webgl-help">Save the complete proposal, compare layouts or dim levels and export a preliminary lighting report.</p>';$('lxRoomForm').appendChild(section);
function open(){if(busy)return;if(!$('lxScenarioName').value)$('lxScenarioName').value=state.projectName||'';renderComparison();dlg.showModal();}
entry.onclick=open;$('lxRoomScenarios').onclick=open;$('lxScenarioClose').onclick=()=>dlg.close();
function status(message,error=false){$('lxScenarioStatus').textContent=message;$('lxScenarioStatus').dataset.error=String(error);}
function safeJSON(value){if(!value||typeof value!=='object')return;if(Array.isArray(value)){for(const v of value)safeJSON(v);return;}for(const [key,v]of Object.entries(value)){if(['__proto__','prototype','constructor'].includes(key))throw new Error('Unsafe scenario key.');safeJSON(v);}}
function validModel(model){const d=copy(model);const checkText=v=>{if(typeof v==='string'&&/[<>]/.test(v))throw new Error('Markup is not permitted in design fields.');if(v&&typeof v==='object')for(const x of Object.values(v))checkText(x);};checkText(d);if(!d||!LINK_TYPES.includes(d.type)||!d.state||typeof d.state!=='object')throw new Error('Invalid LINK XL design.');safeJSON(d);const s=d.state,all=[];const number=(x,min,max,label)=>{if(typeof x!=='number'||!Number.isFinite(x)||x<min||x>max)throw new Error('Invalid '+label+'.');};
 for(const key of ['profiles','corners','endcaps','modules','blanks','groups','measures']){if(!Array.isArray(s[key])||s[key].length>5000)throw new Error('Invalid '+key+'.');if(key!=='measures')all.push(...s[key]);}
 const ids=new Set();for(const item of all){if(!item||typeof item.id!=='string'||!item.id||item.id.length>100||/[<>&"']/.test(item.id)||ids.has(item.id))throw new Error('Invalid or duplicate item ID.');ids.add(item.id);for(const key of ['tag','name','color','system','kind','grp','host'])if(item[key]!=null&&(typeof item[key]!=='string'||item[key].length>200||/[<>]/.test(item[key])))throw new Error('Invalid item '+key+'.');}
 const hosts=new Set(s.profiles.map(p=>p.id));for(const p of [...s.profiles,...s.corners]){number(p.x,-1000000,1000000,'X');number(p.y,-1000000,1000000,'Y');number(p.rot||0,0,360,'rotation');if(!['st70','st90','xlr'].includes(p.system))throw new Error('Unknown profile system.');if(hosts.has(p.id))number(p.length,50,20000,'profile length');else if(!CORNER_GEOM[p.kind]&&!POWER_CONNECTORS?.[p.kind])throw new Error('Unknown corner / connector.');}
 for(const m of s.modules){if(!hosts.has(m.host)||!LED_TYPES[m.type]||!LED_TYPES[m.type].ccts.includes(m.cct)||!Number.isInteger(m.wl)||!wlArrayFor(LED_TYPES[m.type],m.cct)[m.wl])throw new Error('Invalid LED module or host.');number(m.local,-20000,20000,'module position');}
 for(const b of s.blanks){if(!hosts.has(b.host))throw new Error('Invalid blank host.');number(b.local,-20000,20000,'blank position');if(b.len!=null)number(b.len,0,20000,'blank length');}
 for(const cap of s.endcaps){number(cap.cx,-1000000,1000000,'end cap X');number(cap.cy,-1000000,1000000,'end cap Y');if(!Array.isArray(cap.dir)||cap.dir.length!==2||cap.dir.some(v=>!Number.isFinite(v)||Math.abs(v)>1))throw new Error('Invalid end cap direction.');}
 if(typeof s.projectName!=='string'||s.projectName.length>200||/[<>]/.test(s.projectName))throw new Error('Invalid project name.');number(s.scale,.001,100,'drawing scale');number(s.panX,-1000000,1000000,'drawing pan');number(s.panY,-1000000,1000000,'drawing pan');number(s.seq,1,100000000,'sequence');
 if(s.lockedIds!=null&&(!Array.isArray(s.lockedIds)||s.lockedIds.some(id=>!ids.has(id))))throw new Error('Invalid locked selection.');s.lockedIds=s.lockedIds||[];s.multi=(s.multi||[]).filter(id=>ids.has(id));s.selectedId=ids.has(s.selectedId)?s.selectedId:null;return d;
}
function capture(){const s=copy(state);s.measureMode=false;s.measurePt=null;s.measureHover=null;s.lockedIds=(s.lockedIds||[]).filter(id=>findItem(id));return {format:'LINK-XL-full-scenario',version:1,name:$('lxScenarioName').value.trim()||state.projectName||'LINK XL proposal',createdAt:new Date().toISOString(),model:{type:TYPE,state:s},room:LINKXL3D.exportScenario(),workspace:{filter:LINKXLWorkspace.filter}};}
function validate(input,includeComparisons=true){safeJSON(input);if(!input||input.format!=='LINK-XL-full-scenario'||input.version!==1)throw new Error('Choose a LINK XL full scenario file.');if(typeof input.name!=='string'||input.name.length>100||/[<>]/.test(input.name))throw new Error('Invalid scenario name.');const d=copy(input);d.model=validModel(d.model);d.room=LINKXL3D.validateScenario(d.room);if(!['all','profiles','modules','corners'].includes(d.workspace?.filter))throw new Error('Invalid selection filter.');if(includeComparisons&&d.comparisons)for(const key of ['A','B'])if(d.comparisons[key])d.comparisons[key]=validate(d.comparisons[key],false);if(!includeComparisons)delete d.comparisons;return d;}
function applyRaw(d){closeEditor();leaveMeasureMode();applyType(d.model.type);const keys=new Set([...Object.keys(state),'cornerBlank','cornerBlankCustomColor','cornerCover','powerKind','powerColor']);for(const key of keys){if(Object.hasOwn(d.model.state,key))state[key]=copy(d.model.state[key]);else if(Object.hasOwn(defaultState,key))state[key]=copy(defaultState[key]);else delete state[key];}normalizeTypeDefaults();state.measureMode=false;state.measurePt=null;state.measureHover=null;buildSidebar();syncUI();render();LINKXL3D.importScenario(d.room);LINKXLWorkspace.setFilter(d.workspace.filter);$('lxScenarioName').value=d.name;}
function apply(input,{resetHistory=true,comparisons=true}={}){const d=validate(input,comparisons),old=capture();try{applyRaw(d);}catch(err){applyRaw(old);throw err;}if(resetHistory){history=[];redoStack=[];updateUndoBtn();fileHandles={};lastHandle=null;projectSaved=false;dirty=true;}if(comparisons&&d.comparisons){for(const key of ['A','B'])slots[key]=d.comparisons[key]?{snapshot:d.comparisons[key],analysis:null}:null;renderComparison();}return true;}
function downloadBlob(blob,name){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);}
window.addEventListener('keydown',e=>{if(busy){e.preventDefault();e.stopImmediatePropagation();return;}if(dlg.open){if((e.ctrlKey||e.metaKey)&&['s','z','y','d','g'].includes(e.key.toLowerCase()))e.preventDefault();if(!e.target.closest?.('input,textarea,select,button')&&e.key!=='Escape')e.preventDefault();e.stopImmediatePropagation();}},true);
function filename(s){return (s||'LINK_XL').replace(/[^\p{L}\p{N}_ -]/gu,'').trim().replace(/\s+/g,'_').slice(0,100)||'LINK_XL';}
$('lxScenarioSave').onclick=()=>{try{const d=capture();d.comparisons=Object.fromEntries(['A','B'].map(k=>[k,slots[k]?.snapshot||null]));downloadBlob(new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),filename(d.name)+'_scenario.json');status('Full scenario saved, including the raw LDT files and A/B captures.');}catch(err){status(err.message,true);}};
$('lxScenarioOpen').onclick=()=>$('lxScenarioFile').click();$('lxScenarioFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{if(f.size>30000000)throw new Error('Scenario exceeds 30 MB.');const d=validate(JSON.parse(await f.text()));apply(d);status('Full scenario restored. Saved A/B captures can be recalculated.');}catch(err){status('Scenario not loaded: '+err.message,true);}};
async function run(task){if(busy)return;busy=true;const reopen=dlg.open,previousInert=$('lxRoom').inert;if(reopen)dlg.close();busyPanel.hidden=false;$('lxRoom').inert=true;try{await new Promise(r=>setTimeout(r,30));return await task();}catch(err){status(err.message,true);toast(err.message);return null;}finally{busy=false;busyPanel.hidden=true;$('lxRoom').inert=previousInert;if(reopen&&!dlg.open)dlg.showModal();}}
async function analyzeSnapshot(s){const original=capture(),saveHistory=history,saveRedo=redoStack,saveDirty=dirty,handles=fileHandles,last=lastHandle,saved=projectSaved;try{apply(s,{resetHistory:false,comparisons:false});return await LINKXL3D.analyzeScenario();}finally{apply(original,{resetHistory:false,comparisons:false});history=saveHistory;redoStack=saveRedo;dirty=saveDirty;fileHandles=handles;lastHandle=last;projectSaved=saved;updateUndoBtn();}}
for(const key of ['A','B']){$('lxCapture'+key).onclick=()=>run(async()=>{const snapshot=capture(),analysis=await LINKXL3D.analyzeScenario();slots[key]={snapshot,analysis};renderComparison();status('Captured '+key+' with fresh room, lux and preliminary UGR results.');});$('lxApply'+key).onclick=()=>{try{apply(slots[key].snapshot,{comparisons:false});status('Applied '+key+'.');}catch(err){status(err.message,true);}};}
$('lxRecalculateAB').onclick=()=>run(async()=>{for(const key of ['A','B'])if(slots[key])slots[key].analysis=await analyzeSnapshot(slots[key].snapshot);renderComparison();status('A/B results recalculated from their saved scenarios.');});
function comparable(a,b){if(!a||!b)return {lux:false,ugr:false,reasons:['Capture and calculate both scenarios.']};const c=x=>{const d=copy(x.room);delete d.library;delete d.output;delete d.lastOutput;delete d.view;return d;},ra=c(a),rb=c(b),ugrA=copy(ra.ugr),ugrB=copy(rb.ugr);delete ra.ugr;delete rb.ugr;const complete=a.total>0&&b.total>0&&a.mapped===a.total&&b.mapped===b.total;const lux=!!a.lux&&!!b.lux&&complete&&JSON.stringify(ra)===JSON.stringify(rb)&&JSON.stringify(a.surfaces.map(s=>s.surface))===JSON.stringify(b.surfaces.map(s=>s.surface))&&a.warnings.length===0&&b.warnings.length===0;const ugr=lux&&JSON.stringify(ugrA)===JSON.stringify(ugrB)&&a.ugr?.value!=null&&b.ugr?.value!=null;return {lux,ugr,reasons:[...(!complete?['Incomplete LDT mapping: no numeric differences are calculated.']:[]),...(!lux&&complete?['Room, calculation surfaces, maintenance settings or geometry warnings differ.']:[]),...(!ugr&&lux?['UGR observer / background assumptions differ, or an index is unavailable.']:[])]};}
const fmt=(n,d=1)=>Number.isFinite(n)?n.toFixed(d):'—';
function rows(a){return [['Relative output',a?`${a.outputPercent}%`:'—'],['LDT coverage',a?`${a.mapped}/${a.total} modules`:'—'],['Rated luminous flux · mapped modules',a?fmt(a.ratedLm,0)+' lm':'—'],['Luminous flux at selected output',a?fmt(a.effectiveLm,0)+' lm':'—'],['Rated LDT power · mapped modules',a?fmt(a.ratedW)+' W':'—'],['Calculation surface',a?.surfaces.map(r=>r.surface.name+' · '+fmt(r.surface.height,2)+' m').join('; ')||'—'],['Eavg / Emin / Emax',a?.lux?[a.lux.average,a.lux.minimum,a.lux.maximum].map(n=>fmt(n)).join(' / ')+' lx':'—'],['U₀ = Emin / Eavg',a?.lux?fmt(a.lux.uniformity,2):'—'],['Area above target',a?.lux?fmt(a.lux.coverage)+'% ≥ '+a.lux.target+' lx':'—'],['Preliminary UGR',a?.ugr?.value!=null?'≈ '+a.ugr.display:a?.ugrUnavailable||a?.ugr?.warnings.join(' ')||'Unavailable'],['Background luminance',a?.ugr?fmt(a.ugr.background.Lb,2)+' cd/m² · '+a.ugr.background.mode:'—'],['Observer',a?`X ${a.room.ugr.x} / Y ${a.room.ugr.z} / eye ${a.room.ugr.height} m / ${a.room.ugr.heading}°`:'—']];}
function renderComparison(){const host=$('lxComparison');host.replaceChildren();for(const key of ['A','B'])$('lxApply'+key).disabled=!slots[key];$('lxRecalculateAB').disabled=!slots.A&&!slots.B;$('lxComparePDF').disabled=!slots.A?.analysis||!slots.B?.analysis;
 if(!slots.A&&!slots.B)return;const table=document.createElement('table');table.className='lx-compare';const head=document.createElement('tr');for(const t of ['Metric','A','B']){const th=document.createElement('th');th.textContent=t;head.appendChild(th);}table.appendChild(head);const names=document.createElement('tr');for(const t of ['Scenario',slots.A?.snapshot.name||'Not captured',slots.B?.snapshot.name||'Not captured']){const td=document.createElement('td');td.textContent=t;names.appendChild(td);}table.appendChild(names);const imageRow=document.createElement('tr');imageRow.appendChild(document.createElement('td'));for(const key of ['A','B']){const td=document.createElement('td');if(slots[key]?.analysis?.roomImage){const im=document.createElement('img');im.src=slots[key].analysis.roomImage;im.alt='Room in scenario '+key;td.appendChild(im);}else td.textContent=slots[key]?'Saved · recalculate results':'—';imageRow.appendChild(td);}table.appendChild(imageRow);
 const ar=rows(slots.A?.analysis),br=rows(slots.B?.analysis);ar.forEach((row,i)=>{const tr=document.createElement('tr');for(const t of [row[0],row[1],br[i][1]]){const td=document.createElement('td');td.textContent=t;tr.appendChild(td);}table.appendChild(tr);});host.appendChild(table);
 const a=slots.A?.analysis,b=slots.B?.analysis,comp=comparable(a,b),note=document.createElement('p');note.className='lx-scenario-help';note.textContent=comp.reasons.join(' ');if(comp.lux)note.textContent=`B − A · Eavg ${fmt(b.lux.average-a.lux.average)} lx · emitted flux ${fmt(b.effectiveLm-a.effectiveLm,0)} lm`+(comp.ugr?` · UGR ${fmt(b.ugr.value-a.ugr.value,2)}`:'')+'. Same calculation surfaces and room assumptions.';host.appendChild(note);
 if(a&&b)for(const i of ['A','B']){const report=slots[i].analysis;if(report.mapped<report.total||report.warnings.length){const p=document.createElement('p');p.className='lx-scenario-help';p.textContent=i+': '+(report.mapped<report.total?'Partial LDT coverage. ':'')+report.warnings.join(' ');host.appendChild(p);}}
}
function pdfDoc(){const C=window.LINKXLReportEngine?.jsPDF;if(!C||!window.LINKXLReportFonts)throw new Error('The embedded PDF library is unavailable.');const pdf=new C({unit:'mm',format:'a4',compress:true});pdf.addFileToVFS('LINKReport.ttf',LINKXLReportFonts.regular);pdf.addFont('LINKReport.ttf','LINKReport','normal');pdf.addFileToVFS('LINKReportBold.ttf',LINKXLReportFonts.bold);pdf.addFont('LINKReportBold.ttf','LINKReport','bold');pdf.setFont('LINKReport');pdf.setProperties({title:'LINK XL · preliminary lighting proposal',author:'LINK XL Configurator',subject:'Sales preview · room, lm, lux and preliminary UGR'});return pdf;}
function layoutPDF(pdf){let y=18;const w=174;function page(title){if(pdf.getNumberOfPages()>1||y>20)pdf.addPage();y=18;heading(title);}function ensure(h){if(y+h>277){pdf.addPage();y=18;}}function text(t,size=9,bold=false){pdf.setFont('LINKReport',bold?'bold':'normal');pdf.setFontSize(size);pdf.setTextColor(43,58,69);const lines=pdf.splitTextToSize(String(t),w);const h=lines.length*size*.43;ensure(h+4);pdf.text(lines,18,y);y+=h+4;}function heading(t){text(t,16,true);}function image(src,maxHeight=100){if(!src)return;const p=pdf.getImageProperties(src),height=Math.min(maxHeight,w*p.height/p.width),width=height*p.width/p.height;ensure(height+6);pdf.addImage(src,'JPEG',18+(w-width)/2,y,width,height);y+=height+7;}function pairs(data){for(const [k,v]of data)text(k+' · '+v,9);}function scaleBar(scale){if(!Number.isFinite(scale))return;ensure(17);const stops=[[0,21,46,136],[.25,30,155,195],[.5,73,183,155],[.75,246,214,76],[1,217,76,54]];for(let i=0;i<100;i++){const t=i/99,k=Math.min(3,Math.floor(t*4)),a=stops[k],b=stops[k+1],f=(t-a[0])/(b[0]-a[0]);pdf.setFillColor(...[1,2,3].map(j=>Math.round(a[j]*(1-f)+b[j]*f)));pdf.rect(18+i*w/100,y,w/100+.05,4,'F');}y+=10;pdf.setFont('LINKReport');pdf.setFontSize(8);pdf.setTextColor(43,58,69);pdf.text('0',18,y);pdf.text(fmt(scale/2,0),18+w/2,y,{align:'center'});pdf.text(fmt(scale,0)+' lx',18+w,y,{align:'right'});y+=8;}function imagePair(left,right){const width=(w-8)/2,images=[left,right].map(src=>src?{src,p:pdf.getImageProperties(src)}:null),height=Math.max(...images.map(x=>x?Math.min(65,width*x.p.height/x.p.width):0));ensure(height+8);images.forEach((x,i)=>{if(x){const h=Math.min(65,width*x.p.height/x.p.width),iw=h*x.p.width/x.p.height;pdf.addImage(x.src,'JPEG',18+i*(width+8)+(width-iw)/2,y,iw,h);}});y+=height+8;}function table(headers,rows){const widths=[66,54,54];for(const [index,row]of [headers,...rows].entries()){pdf.setFont('LINKReport',index===0?'bold':'normal');pdf.setFontSize(8);const cells=row.map((v,i)=>pdf.splitTextToSize(String(v),widths[i]-5)),height=Math.max(...cells.map(c=>c.length))*3.6+6;ensure(height);if(index===0){pdf.setFillColor(240,244,246);pdf.rect(18,y-3,w,height,'F');}let x=18;for(let i=0;i<3;i++){pdf.setTextColor(43,58,69);pdf.text(cells[i],x+2,y+1);x+=widths[i];}pdf.setDrawColor(222,228,231);pdf.line(18,y+height-4,18+w,y+height-4);y+=height;}y+=5;}function footer(){for(let i=1;i<=pdf.getNumberOfPages();i++){pdf.setPage(i);pdf.setFont('LINKReport');pdf.setFontSize(7);pdf.setTextColor(108,119,127);pdf.text('LINK XL · Preliminary sales preview · '+i+' / '+pdf.getNumberOfPages(),18,289);}}return {text,heading,image,imagePair,table,pairs,page,scaleBar,footer};}
function assumptions(r,p){p.heading('Παραδοχές & όρια');p.text('Πρόχειρη εκτίμηση για συζήτηση πωλητή και πελάτη. Τα αποτελέσματα δεν αποτελούν μελέτη φωτισμού ή έλεγχο συμμόρφωσης.');p.text('Lux: άμεσο φως από LDT, σημειακή προσέγγιση ανά module και γεωμετρικές σκιές. Δεν υπολογίζονται ανακλάσεις, φυσικό φως ή φωτεινές γωνίες. Το UGR αφορά μία θέση και μία οριζόντια κατεύθυνση παρατηρητή, με ομοιόμορφη επίπεδη φωτεινή επιφάνεια ανά module.');p.text('Το dim μεταβάλλει γραμμικά lm και cd. Η κατανομή και το CCT παραμένουν σταθερά. Τα W είναι η ονομαστική ισχύς των LDT, χωρίς πρόβλεψη ηλεκτρικής κατανάλωσης κατά το dim.');p.text('Το Auto Lb είναι απλή εκτίμηση φωτεινού υποβάθρου από τη ροή και τις ανακλαστικότητες του χώρου. Το additional Lb παραμένει σταθερό στο dim. Τα χρώματα του 3D δεν αλλάζουν τις αριθμητικές ανακλαστικότητες.');if(r.mapped<r.total)p.text('PARTIAL DATA: '+r.mapped+'/'+r.total+' modules with LDT. Flux and lux include only mapped modules.');for(const warning of r.warnings)p.text(warning);if(r.ugr)for(const warning of r.ugr.warnings)p.text(warning);}
function roomPDF(r,name){const pdf=pdfDoc(),p=layoutPDF(pdf);p.heading('LINK XL · Πρόταση φωτισμού');p.text(name,12,true);p.text(new Date(r.createdAt).toLocaleString('el-GR',{timeZone:'Europe/Athens'})+' · Preliminary estimate');p.image(r.roomImage,105);const c=r.room.controls;p.pairs([['Room',`${c.lxWidth} × ${c.lxLength} × ${c.lxHeight} m · ${LINK_TYPE_LABEL[r.type]}${r.type==='pendant'?' · drop '+c.lxDrop+' m':''}`],['Luminaire placement',`X ${c.lxOffsetX} / Y ${c.lxOffsetY} m`],['LED emitting height',r.luminaireHeights?.length?fmt(Math.min(...r.luminaireHeights),3)+' – '+fmt(Math.max(...r.luminaireHeights),3)+' m above floor':'—'],...rows(r).slice(0,5)]);p.page('Light map · πραγματικές επιφάνειες');p.image(r.mapImage,110);p.scaleBar(r.lux?.scale);p.text('Κλίμακα Light map: 0 – '+(r.lux?.scale??'—')+' lx. MF '+c.lxMaintenance+'. Calculation mode: '+c.lxLuxHeight+'.');if(!r.surfaces.length)p.text('Δεν υπάρχουν υπολογισμένες επιφάνειες. Ελέγξτε την ανάθεση LDT και τη θέση του plane / επίπλου.');for(const s of r.surfaces)p.pairs([[s.surface.name,`${fmt(s.surface.width,2)} × ${fmt(s.surface.depth,2)} m · H ${fmt(s.surface.height,2)} m · grid ${s.nx}×${s.nz}`],['Surface position',`X ${fmt(s.surface.x,2)} / Y ${fmt(s.surface.z,2)} m · rotation ${fmt((s.surface.angle||0)*180/Math.PI,0)}°`],['Eavg / Emin / Emax',`${fmt(s.average)} / ${fmt(s.minimum)} / ${fmt(s.maximum)} lx`],['U₀ / target coverage',`${fmt(s.uniformity,2)} / ${fmt(s.coverage)}% ≥ ${s.target} lx`]]);p.page('UGR ≈ · Θέση παρατηρητή & υπόβαθρο');p.pairs(rows(r).slice(9));const u=r.room.ugr;p.pairs([['Background settings',u.background==='manual'?`Mode manual · fixed total Lb ${u.Lb} cd/m²`:`Mode auto · additional Lb ${u.additionalLb} cd/m²`],['Reflectances',`Ceiling ${u.rhoCeiling} · wall ${u.rhoWall} · floor ${u.rhoFloor}`]]);if(r.ugr){p.text(r.ugr.background.mode==='manual'?'Fixed total background '+fmt(r.ugr.background.Lb,3)+' cd/m²':'LINK XL background '+fmt(r.ugr.background.linkXLBackgroundLb,3)+' + additional '+fmt(r.ugr.background.additionalLb,3)+' = total '+fmt(r.ugr.background.Lb,3)+' cd/m²');for(const term of r.ugr.terms)p.text(`${term.module}: L ${fmt(term.luminance,0)} cd/m² · area ${fmt(term.luminousAreaM2*10000,2)} cm² (${term.areaBasis}) · distance ${fmt(term.distanceM,2)} m`);}p.heading('LDT ανά specification');for(const f of r.ldt)p.text(`${f.count} × ${f.module} / ${f.cct} / ${f.beam||'—'} · ${f.file||'NO LDT'}${f.data?` · ${fmt(f.data.flux*f.data.lor/100,1)} lm · ${fmt(f.data.watt)} W · emitting area ${f.data.areaOverrideCm2||fmt(f.data.luminousLength*f.data.luminousWidth*10000,2)} cm² (${f.data.areaOverrideCm2?'manual override':'LDT'})`:''}`);assumptions(r,p);p.footer();return pdf;}
function comparisonPDF(a,b){const pdf=pdfDoc(),p=layoutPDF(pdf);p.heading('LINK XL · Σύγκριση A / B');p.text('A · '+slots.A.snapshot.name+'    |    B · '+slots.B.snapshot.name,10,true);p.imagePair(a.roomImage,b.roomImage);const ar=rows(a),br=rows(b);p.table(['Metric','A','B'],ar.map((row,i)=>[row[0],row[1],br[i][1]]));const comp=comparable(a,b);p.text(comp.lux?`B − A · Eavg ${fmt(b.lux.average-a.lux.average)} lx · lm ${fmt(b.effectiveLm-a.effectiveLm,0)}`:comp.reasons.join(' '));if(comp.ugr)p.text('B − A · UGR '+fmt(b.ugr.value-a.ugr.value,2));for(const [key,r]of [['A',a],['B',b]]){p.page(key+' · Light map & settings');p.image(r.mapImage,90);p.scaleBar(r.lux?.scale);const c=r.room.controls,u=r.room.ugr,table=r.room.tables[c.lxFurniture],plane=r.room.plane;p.pairs([['Room',`${c.lxWidth} × ${c.lxLength} × ${c.lxHeight} m · ${LINK_TYPE_LABEL[r.type]}`],['Luminaire placement',`X ${c.lxOffsetX} / Y ${c.lxOffsetY} m${r.type==='pendant'?' · drop '+c.lxDrop+' m':''}`],['Calculation',`${c.lxLuxHeight} · MF ${c.lxMaintenance} · target ${c.lxLuxTarget} lx`],['Furniture',table?`${c.lxFurniture} · ${table.width} × ${table.depth} m · H ${table.height} m · X ${table.x} / Y ${table.z} m · ${table.angle}°`:'Empty room'],['Custom plane',plane.enabled?`${plane.width} × ${plane.depth} m · H ${plane.height} m · X ${plane.x} / Y ${plane.z} m · ${plane.angle}°`:'Disabled'],['Observer',`X ${u.x} / Y ${u.z} / eye ${u.height} m / ${u.heading}°`],['Background',`${u.background} · ${u.background==='manual'?'total Lb '+u.Lb:'additional Lb '+u.additionalLb} cd/m² · ρ ceiling/wall/floor ${u.rhoCeiling}/${u.rhoWall}/${u.rhoFloor}`]]);for(const l of r.ldt)p.text(`${l.count} × ${l.module} / ${l.cct} / ${l.beam||'—'} · ${l.file||'NO LDT'}${l.data?' · emitting area '+(l.data.areaOverrideCm2||fmt(l.data.luminousLength*l.data.luminousWidth*10000,2))+' cm²':''}`);if(r.mapped<r.total)p.text('Partial LDT coverage: '+r.mapped+'/'+r.total);for(const warning of r.warnings)p.text(warning);if(r.ugr)for(const warning of r.ugr.warnings)p.text(warning);}p.page('Παραδοχές σύγκρισης');assumptions(a,p);p.footer();return pdf;}
function savePDF(pdf,name){downloadBlob(pdf.output('blob'),filename(name)+'.pdf');}
function makeCurrentPDF(){return run(async()=>{const name=$('lxScenarioName').value.trim()||state.projectName||'LINK_XL_room',report=await LINKXL3D.analyzeScenario();savePDF(roomPDF(report,name),name+'_lighting_report');status('Room PDF created with fresh images, numerical results, LDT and assumptions.');});}
$('lxScenarioPDF').onclick=makeCurrentPDF;$('lxRoomPDF').onclick=makeCurrentPDF;$('lxComparePDF').onclick=()=>run(async()=>{if(!slots.A?.analysis||!slots.B?.analysis)throw new Error('Capture or recalculate both scenarios first.');savePDF(comparisonPDF(slots.A.analysis,slots.B.analysis),'LINK_XL_comparison_AB');status('Comparison PDF created from the captured A/B scenarios.');});
window.LINKXLScenarios={capture,validate,apply,analyzeSnapshot,comparable,getSlots:()=>copy(slots),roomPDF,comparisonPDF,rows};
})();
